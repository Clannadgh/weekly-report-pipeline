    if (!runId) return;
    s2DetailTitle.textContent = "S2 · " + String(runId).toUpperCase();
    s2DetailBody.textContent = "正在读取…";
    if (!s2DetailDialog.open) s2DetailDialog.showModal();
    try {
      var resp = await fetch("/api/s2/" + encodeURIComponent(runId));
      var data = await resp.json();
      if (!data.ok || !data.cards) throw new Error(data.error || "没有这次拆卡结果");
      renderS2Detail(data.cards);
    } catch (err) {
      s2DetailBody.textContent = "读取失败：" + (err.message || err);
    }
  }

  function s3Tone(state) {
    if (state === "ok") return "ok";
    if (state === "blocked") return "stop";
    return "warn";
  }

  function s3StateLabel(state) {
    if (state === "ok") return "对账完成";
    if (state === "blocked") return "对账未完成";
    return String(state || "未知");
  }

  function s3LevelTone(level) {
    if (level === "阻断") return "stop";
    if (level === "提示") return "warn";
    return "";
  }

  function renderS3Detail(issues, ledger, approval, runId, quotes) {
    quotes = quotes || {};
    var body = s3DetailBody;
    body.textContent = "";
    body.scrollTop = 0;
    var state = String(issues.state || "");
    var stats = issues.stats || {};
    var bar = el("div", "detail-state " + s3Tone(state));
    bar.appendChild(el("span", "d-state-badge", s3StateLabel(state)));
    bar.appendChild(el("span", "detail-state-msg", issues.message || ""));
    body.appendChild(bar);

    var meta = [issues.run_id, issues.week].filter(Boolean).join(" · ");
    if (meta) body.appendChild(el("p", "detail-note", meta));

    var grid = el("div", "s2-stats");
    [
      ["阻断", stats.blocking || 0],
      ["提示", stats.warn || 0],
      ["信息", stats.info || 0],
      ["已核对", stats.checked || 0],
      ["豁免", stats.waived || 0]
    ].forEach(function (item) {
      var box = el("div", "s2-stat");
      box.appendChild(el("div", "k", item[0]));
      box.appendChild(el("div", "v", String(item[1])));
      grid.appendChild(box);
    });
    body.appendChild(grid);

    var results = issues.results || [];
    var resultByCard = {};
    results.forEach(function (item) {
      if (item.card) resultByCard[item.card] = item;
    });
    var ledgerByCard = {};
    ((ledger && ledger.entries) || []).forEach(function (entry) {
      if (entry.card && !ledgerByCard[entry.card]) ledgerByCard[entry.card] = entry;
    });

    var issueList = issues.issues || [];
    var issueByCard = {};
    issueList.forEach(function (item) {
      if (item.card) issueByCard[item.card] = item;
    });

    var rows = [];
    var seen = {};
    results.forEach(function (result) {
      var card = result.card || "";
      var issue = card ? issueByCard[card] : null;
      rows.push({ card: card, result: result, issue: issue });
      if (card) seen[card] = true;
    });
    issueList.forEach(function (issue) {
      if (!issue.card || !seen[issue.card]) {
        rows.push({
          card: issue.card || "",
          result: issue.card ? resultByCard[issue.card] : null,
          issue: issue
        });
        if (issue.card) seen[issue.card] = true;
      }
    });

    var blockingIds = s3BlockingIds(issues);

    if (rows.length) {
      var issueSec = detailSection("核对清单");
      if (blockingIds.length) issueSec.appendChild(s3ApproveBar(approval, blockingIds, runId));
      var issueUl = el("ul", "detail-list");
      rows.forEach(function (row) {
        var issue = row.issue;
        var result = row.result;
        var level = issue ? (issue.level || "信息") : "匹配";
        var tone = issue ? s3LevelTone(level) : "ok";
        var li = el("li");
        li.appendChild(el("span", "d-tag " + tone, level));
        li.appendChild(el("span", "d-tag", (issue && issue.id) || row.card || "已核对"));
        li.appendChild(document.createTextNode(
          (issue && issue.subject) || (result && result.subject) || ""
        ));
        var quote = (issue && issue.minutes_said) || quotes[row.card] || "";
        if (quote) {
          li.appendChild(el("div", "detail-sub",
            (issue && issue.minutes_said ? "纪要：" : "原句：") + quote));
        }
        var rawValue = (issue && issue.raw) || (result && result.raw) || "";
        if (rawValue) {
          var dataText = "数据：" + rawValue;
          if (issue && issue.diff !== null && issue.diff !== undefined) {
            dataText += " · 差异：" + issue.diff;
          }
          li.appendChild(el("div", "detail-sub", dataText));
        }
        var explain = (result && result.explain)
          || (ledgerByCard[row.card] && ledgerByCard[row.card].spec)
          || "";
        if (explain) li.appendChild(el("div", "detail-sub", explain));
        if (issue && issue.suggest) {
          li.appendChild(el("div", "detail-sub", "建议：" + issue.suggest));
        } else if (!issue) {
          li.appendChild(el("div", "detail-sub", "核对通过，未发现差异。"));
        }
        if (issue && issue.level === "阻断") {
          li.appendChild(s3DecisionBox(issue, approval, runId));
        }
        issueUl.appendChild(li);
      });
      issueSec.appendChild(issueUl);
      body.appendChild(issueSec);
    } else {
      body.appendChild(el("p", "detail-note", "没有核对结果。"));
    }

    var waived = issues.waived || [];
    if (waived.length) {
      var waiverSec = detailSection("S1 人工豁免");
      waiverSec.appendChild(el("p", "detail-note",
        "以下事项已在 S1 由用户确认，对账不再当作缺口或冲突；相关卡片没有计入核对数。"));
      var waiverList = el("ul", "detail-list");
      waived.forEach(function (item) {
        var li = el("li");
        li.appendChild(el("span", "d-tag warn", "豁免"));
        li.appendChild(document.createTextNode(item.item || "—"));
        if (item.reason) li.appendChild(el("div", "detail-sub", "理由：" + item.reason));
        if ((item.cards || []).length) {
          li.appendChild(el("div", "detail-sub", "涉及卡片：" + item.cards.join("、")));
        }
        waiverList.appendChild(li);
      });
      waiverSec.appendChild(waiverList);
      body.appendChild(waiverSec);
    }
  }

  function s3BlockingIds(issues) {
    return ((issues && issues.issues) || []).filter(function (item) {
      return item && item.level === "阻断" && item.id;
    }).map(function (item) { return String(item.id); });
  }

  function s3Decision(approval, issueId) {
    var decisions = (approval && approval.decisions) || {};
    return decisions[issueId] || null;
  }

  function s3Tally(approval, blockingIds) {
    var counts = { accepted: 0, rejected: 0, pending: 0, total: blockingIds.length };
    blockingIds.forEach(function (id) {
      var item = s3Decision(approval, id);
      if (!item) counts.pending += 1;
      else if (item.decision === "reject") counts.rejected += 1;
      else counts.accepted += 1;
    });
    return counts;
  }

  function s3ApproveBar(approval, blockingIds, runId) {
    var bar = el("div", "s3-approve");
    fillS3ApproveBar(bar, approval, blockingIds, runId);
    return bar;
  }

  function fillS3ApproveBar(bar, approval, blockingIds, runId) {
    bar.textContent = "";
    if (!blockingIds.length) {
      bar.remove();
      return;
    }
    var counts = s3Tally(approval, blockingIds);
    if (!counts.pending) {
      bar.appendChild(el("span", "d-tag ok", "阻断已处理"));
      bar.appendChild(el("span", "s3-approve-hint",
        "已批准 " + counts.accepted + " 条、已拒绝 " + counts.rejected + " 条。"));
      return;
    }
    var handled = counts.accepted + counts.rejected;
    bar.appendChild(el("span", "d-tag stop", "阻断 " + counts.total + " 条"));
    bar.appendChild(el("span", "s3-approve-hint",
      handled
        ? "已处理 " + handled + " 条，还剩 " + counts.pending + " 条。逐条批准或拒绝，或点"
        : "逐条批准或拒绝，或点"));
    var btn = el("button", "btn btn-primary btn-sm", "全部批准");
    btn.type = "button";
    btn.addEventListener("click", function () {
      approveAllBlocking(runId, bar, btn);
    });
    bar.appendChild(btn);
  }

  function s3DecisionBox(issue, approval, runId) {
    var box = el("div", "s3-decide");
    var current = s3Decision(approval, issue.id);
    [["accept", "批准"], ["reject", "拒绝"]].forEach(function (pair) {
      var action = pair[0];
      var btn = el("button",
        "s3-decide-btn " + action + (current && current.decision === action ? " on" : ""),
        pair[1]);
      btn.type = "button";
      btn.addEventListener("click", function () {
        submitS3Decision(runId, issue.id, action);
      });
      box.appendChild(btn);
    });
    if (current) {
      var at = String(current.at || "").replace("T", " ").slice(0, 16);
      box.appendChild(el("span", "s3-decide-note",
        (current.decision === "reject" ? "已拒绝" : "已批准") + (at ? " · " + at : "")));
    } else {
      box.appendChild(el("span", "s3-decide-note", "是否采纳这条建议？"));
    }
    return box;
  }

  function applyS3Approval(data) {
    if (!s3View) return;
    s3View.approval = (data && data.approval)
      || (data && data.approvals && data.approvals.s3)
      || {};
    var top = s3DetailBody.scrollTop;
    renderS3Detail(s3View.issues, s3View.ledger, s3View.approval, s3View.runId, s3View.quotes);
    s3DetailBody.scrollTop = top;
    syncPipelineFromServer(s3View.runId);
    if (data && data.note) appendMessage("assistant", data.note);
  }

  function showS3Error(text) {
    var old = s3DetailBody.querySelector(".s3-error");
    if (old) old.remove();
    s3DetailBody.insertBefore(el("p", "detail-note s3-error", text), s3DetailBody.firstChild);
    s3DetailBody.scrollTop = 0;
  }

  async function submitS3Decision(runId, issueId, action) {
    if (!runId) return;
    try {
      var resp = await fetch("/api/runs/" + encodeURIComponent(runId) + "/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          stage: "s3", issue_id: issueId, action: action, session_id: sessionId || ""
        })
      });
      var data = await resp.json();
      if (!data.ok) throw new Error(data.error || "记录失败");
      applyS3Approval(data);
    } catch (err) {
      showS3Error("记录失败：" + (err.message || err));
    }
  }

  async function approveAllBlocking(runId, bar, btn) {
    if (!runId) return;
    btn.disabled = true;
    btn.textContent = "批准中…";
    try {
      var resp = await fetch("/api/runs/" + encodeURIComponent(runId) + "/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stage: "s3", action: "accept", session_id: sessionId || "" })
      });
      var data = await resp.json();
      if (!data.ok) throw new Error(data.error || "批准失败");
      applyS3Approval(data);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "全部批准";
      showS3Error("批准失败：" + (err.message || err));
    }
  }

  async function s3CardQuotes(runId) {
    try {
      var resp = await fetch("/api/s2/" + encodeURIComponent(runId));
      var data = await resp.json();
      var map = {};
      ((data.cards && data.cards.cards) || []).forEach(function (card) {
        if (card && card.id) map[card.id] = card.quote || "";
      });
      return map;
    } catch (err) {
      return {};
    }
  }

  async function openS3Detail(runId) {
    if (!runId) return;
    s3DetailTitle.textContent = "S3 · " + String(runId).toUpperCase();
    s3DetailBody.textContent = "正在读取…";
    if (!s3DetailDialog.open) s3DetailDialog.showModal();
    try {
      var resp = await fetch("/api/s3/" + encodeURIComponent(runId));
      var data = await resp.json();
      if (!data.ok || !data.issues || !Object.keys(data.issues).length) {
        throw new Error(data.error || "没有这次对账结果");
      }
      var quotes = await s3CardQuotes(runId);
      s3View = { issues: data.issues, ledger: data.ledger || {},
                approval: data.approval || {}, runId: runId, quotes: quotes };
      renderS3Detail(s3View.issues, s3View.ledger, s3View.approval, s3View.runId, s3View.quotes);
    } catch (err) {
      s3DetailBody.textContent = "读取失败：" + (err.message || err);
    }
  }

  function s4StateTone(state) {
    if (state === "可扩写") return "ok";
    if (state === "待补充") return "stop";
    return "warn";
  }

  function s4StatusTag(status) {
    var map = {
      corrected: ["ok", "已修正"],
      kept: ["", "保留"],
      future: ["warn", "转未来"],
      blocked: ["stop", "待处理"]
    };
    var item = map[status] || ["", status || "—"];
    return el("span", "d-tag" + (item[0] ? " " + item[0] : ""), item[1]);
  }

  function s4Error(text) {
    var old = s4DetailBody.querySelector(".s4-error");
    if (old) old.remove();
    s4DetailBody.insertBefore(el("p", "detail-note s4-error", text), s4DetailBody.firstChild);
    s4DetailBody.scrollTop = 0;
  }

  function renderS4Detail(corrected, status, runId) {
    var body = s4DetailBody;
    body.textContent = "";
    body.scrollTop = 0;
    s4DetailFoot.textContent = "";
    s4DetailFoot.hidden = true;
    var state = String((status && status.state) || "");
    var stats = corrected.stats || {};
    var summary = "只改纪要底稿，不写报告。";
    var bar = el("div", "detail-state " + s4StateTone(state));
    bar.appendChild(el("span", "d-state-badge", state || "未知"));
    bar.appendChild(el("span", "detail-state-msg", summary));
    body.appendChild(bar);
    var meta = [runId, corrected.week].filter(Boolean).join(" · ");
    if (meta) body.appendChild(el("p", "detail-note", meta));

    var grid = el("div", "s4-stats");
    [["修正", stats.corrected || 0], ["待处理", stats.blocked || 0]].forEach(function (pair) {
      var box = el("div", "s2-stat");
      box.appendChild(el("div", "k", pair[0]));
      box.appendChild(el("div", "v", String(pair[1])));
      grid.appendChild(box);
    });
    body.appendChild(grid);

    var items = corrected.items || [];
    var fixItems = items.filter(function (item) { return item && item.status === "corrected"; });
    var sec = detailSection("修正清单");
    sec.appendChild(el("p", "detail-note",
      "只列真正改过的句子；没有列出的句子按原文保留或转未来。"));
    if (fixItems.length) {
      var list = el("ul", "detail-list");
      fixItems.forEach(function (item) {
        var li = el("li");
        li.appendChild(s4StatusTag(item.status));
        li.appendChild(el("span", "d-tag", item.id || "—"));
        if (item.confirmed === false) li.appendChild(el("span", "d-tag warn", "未确认"));
        var main = item.status === "corrected"
          ? (item.fixed || item.original || "")
          : (item.original || item.fixed || "");
        li.appendChild(el("div", "", (item.status === "corrected" ? "修正后：" : "原句：") + main));
        if (item.status === "corrected" && item.original) {
          li.appendChild(el("div", "detail-sub", "原句：" + item.original));
        }
        if (item.basis) li.appendChild(el("div", "detail-sub", "依据：" + item.basis));
        if (item.issue) li.appendChild(el("div", "detail-sub", "问题：" + item.issue));
        if (item.note) li.appendChild(el("div", "detail-sub", "说明：" + item.note));
        list.appendChild(li);
      });
      sec.appendChild(list);
    } else {
      sec.appendChild(el("p", "detail-note", "本次没有修正；S3 没有需要改写的句子。"));
    }
    body.appendChild(sec);

    var blockedItems = items.filter(function (item) {
      return item && item.status === "blocked";
    });
    if (blockedItems.length) {
      var blockSec = detailSection("待处理");
      blockSec.appendChild(el("p", "detail-note",
        "S4 没能自动改写这些句子，需要人工处理；处理前不能进入 S5。"));
      var blockList = el("ul", "detail-list");
      blockedItems.forEach(function (item) {
        var li = el("li");
        li.appendChild(s4StatusTag(item.status));
        li.appendChild(el("span", "d-tag", item.id || "—"));
        li.appendChild(el("div", "", "原句：" + (item.original || "")));
        if (item.issue) li.appendChild(el("div", "detail-sub", "问题：" + item.issue));
        if (item.note) li.appendChild(el("div", "detail-sub", "说明：" + item.note));
        blockList.appendChild(li);
      });
      blockSec.appendChild(blockList);
      body.appendChild(blockSec);
    }

    var cards = corrected.cards || [];
    if (cards.length) {
      var cardSec = detailSection("待裁决");
      var cardList = el("ul", "detail-list");
      cards.forEach(function (card) {
        var li = el("li");
        li.appendChild(el("span", "d-tag warn", card.id || "待裁决"));
        if (card.issue) li.appendChild(el("span", "d-tag", card.issue));
        li.appendChild(document.createTextNode(card.question || ""));
        if ((card.options || []).length) {
          li.appendChild(el("div", "detail-sub", "选项：" + card.options.join(" / ")));
        }
        if (card.suggest) li.appendChild(el("div", "detail-sub", "建议：" + card.suggest));
        cardList.appendChild(li);
      });
      cardSec.appendChild(cardList);
      body.appendChild(cardSec);
    }

    s4DetailFoot.appendChild(el("span", "detail-foot-hint",
      "S4 只改纪要底稿；结果已落盘 corrected.json，S5 只读这个文件。"));
    var btn = el("button", "btn btn-primary btn-sm", "重新修纪要");
    btn.type = "button";
    btn.addEventListener("click", function () { runS4(runId, btn); });
    s4DetailFoot.appendChild(btn);
    s4DetailFoot.hidden = false;
  }

  function renderS4Empty(runId, message) {
    var body = s4DetailBody;
    body.textContent = "";
    body.scrollTop = 0;
    var bar = el("div", "detail-state");
    bar.appendChild(el("span", "d-state-badge muted", "未修"));
    bar.appendChild(el("span", "detail-state-msg", message || "这次运行还没修过纪要。"));
    body.appendChild(bar);
    body.appendChild(el("p", "detail-note",
      "S4 按 S3 问题清单和逐条裁决，把纪要里说错、说不清的单句改成和数据一致的说法；没有问题的句子原样保留。"));
    s4DetailFoot.textContent = "";
    s4DetailFoot.appendChild(el("span", "detail-foot-hint",
      "需要模型改句；有阻断时先去 S3 详情逐条批准或拒绝。"));
    var btn = el("button", "btn btn-primary btn-sm", "开始修纪要");
    btn.type = "button";
    btn.addEventListener("click", function () { runS4(runId, btn); });
    s4DetailFoot.appendChild(btn);
    s4DetailFoot.hidden = false;
  }

  function syncS4FromServer(runId) {
    if (!runId) return;
    fetch("/api/s4/" + encodeURIComponent(runId))
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (!data.ok || !data.corrected) return;
        var blocked = (data.corrected.stats || {}).blocked || 0;
        pipeline.s4 = { state: blocked ? "待补充" : "可扩写", run: runId, ok: true };
        savePipeline();
        renderPipeline();
      })
      .catch(function () {});
  }

  async function openS4Detail(runId) {
    if (!runId) return;
    s4DetailTitle.textContent = "S4 · " + String(runId).toUpperCase();
    s4DetailBody.textContent = "正在读取…";
    s4DetailFoot.textContent = "";
    s4DetailFoot.hidden = true;
    if (!s4DetailDialog.open) s4DetailDialog.showModal();
    try {
      var resp = await fetch("/api/s4/" + encodeURIComponent(runId));
      var data = await resp.json();
      if (data.ok && data.corrected) {
        var st = data.status || {};
        var blocked = (data.corrected.stats || {}).blocked || 0;
        setPipelineStage("s4", { state: blocked ? "待补充" : "可扩写", run: runId, ok: true });
        renderS4Detail(data.corrected, st, runId);
      } else {
        renderS4Empty(runId, data.error || "这次运行还没修过纪要。");
      }
    } catch (err) {
      s4DetailBody.textContent = "读取失败：" + (err.message || err);
    }
  }

  async function runS4(runId, btn) {
    if (!runId) return;
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "修纪要中…";
    try {
      var resp = await fetch("/api/s4", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ run_id: runId })
      });
      var data = await resp.json();
      if (!data.ok) throw new Error(data.message || data.error || "修纪要失败");
      setPipelineStage("s4", { state: data.state || "", run: data.run_id || runId, ok: true });
      renderS4Detail(data.corrected || {}, { state: data.state || "", note: data.message || "" },
        data.run_id || runId);
      if (data.message) appendMessage("assistant", data.message);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = label;
      s4Error("修纪要失败：" + (err.message || err));
    }
  }

  function s5StateTone(state) {
    if (state === "已生成" || state === "待审核") return "ok";
    if (state === "退回修改") return "stop";
    return "warn";
  }

  function stopS5Polling() {
    if (s5PollTimer) { clearInterval(s5PollTimer); s5PollTimer = null; }
  }

  function startS5Polling(runId) {
    stopS5Polling();
    s5PollTimer = setInterval(async function () {
      try {
        var resp = await fetch("/api/s5/" + encodeURIComponent(runId));
        var data = await resp.json();
        if (data && data.running) return;
        stopS5Polling();
        if (data && data.ok && data.draft) {
          setPipelineStage("s5", {
            state: String((data.status || {}).state || "待审核"), run: runId, ok: true
          });
          renderS5Detail(data, runId);
        } else {
          renderS5Empty(runId, (data && data.error) || "这次运行还没扩写。");
        }
      } catch (err) { /* 下一轮再试 */ }
    }, 3000);
  }

  function s5Error(text) {
    var old = s5DetailBody.querySelector(".s5-error");
    if (old) old.remove();
    s5DetailBody.insertBefore(el("p", "detail-note s5-error", text), s5DetailBody.firstChild);
    s5DetailBody.scrollTop = 0;
  }

  function s5AppendInline(parent, text) {
    var re = /\[\[f:([^\]]+)\]\]/g;
    var last = 0;
    var m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      parent.appendChild(el("code", "s5-token", "[[f:" + m[1] + "]]"));
      last = m.index + m[0].length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function s5SkeletonTexts(skeleton) {
    var out = [];
    (Array.isArray(skeleton) ? skeleton : []).forEach(function (item) {
      var s = (typeof item === "string") ? item
        : (item && (item.fixed || item.text || item.original)) || "";
      s = String(s || "").trim();
      if (s) out.push(s);
    });
    return out;
  }
  function s5LineKind(text, skels) {
    if (!skels.length) return null;
    var plain = String(text).replace(/\[\[f:([^\]]+)\]\]/g, "").trim();
    for (var i = 0; i < skels.length; i++) {
      if (!skels[i]) continue;
      if (plain.indexOf(skels[i]) >= 0 || skels[i].indexOf(plain) >= 0) return "骨架";
    }
    return "补充句";
  }

  function s5RenderMarkdown(text, skels) {
    skels = Array.isArray(skels) ? skels : [];
    var wrap = el("div", "s5-draft");
    var lines = String(text || "").split(/\r?\n/);
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i += 1; continue; }
      if (line.indexOf("# ") === 0) {
        wrap.appendChild(el("h3", "", line.slice(2)));
        i += 1;
        continue;
      }
      if (line.indexOf("## ") === 0) {
        wrap.appendChild(el("h4", "", line.slice(3)));
        i += 1;
        continue;
      }
      if (line.trim().charAt(0) === "|") {
        var table = el("table", "");
        var thead = el("thead", "");
        var tbody = el("tbody", "");
        var rowIndex = 0;
        while (i < lines.length && lines[i].trim().charAt(0) === "|") {
          var row = lines[i].trim();
          if (!/^\|[\s\-:|]+\|$/.test(row)) {
            var cells = row.replace(/^\||\|$/g, "").split("|").map(function (x) { return x.trim(); });
            var tr = el("tr", "");
            cells.forEach(function (cell) {
              var cellEl = el(rowIndex === 0 ? "th" : "td", "");
              s5AppendInline(cellEl, cell);
              tr.appendChild(cellEl);
            });
            if (rowIndex === 0) thead.appendChild(tr);
            else tbody.appendChild(tr);
            rowIndex += 1;
          }
          i += 1;
        }
        table.appendChild(thead);
        table.appendChild(tbody);
        wrap.appendChild(table);
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim()
        && lines[i].indexOf("#") !== 0 && lines[i].trim().charAt(0) !== "|") {
        para.push(lines[i].trim());
        i += 1;
      }
      var p = el("p", "");
      var joined = para.join(" ");
      var kind = s5LineKind(joined, skels);
      if (kind) {
        p.appendChild(el("span", "s5-linetag " + (kind === "骨架" ? "skeleton" : "supp"),
          kind === "骨架" ? "纪要骨架" : "补充句"));
      }
      s5AppendInline(p, joined);
      wrap.appendChild(p);
    }
    return wrap;
  }

  function s5Pct(value) {
    if (typeof value === "number") return (value * 100).toFixed(1) + "%";
    return value == null ? "—" : String(value);
  }

  function s5FigureList(data, runId) {
    var out = [];
    var sources = (data.figures && data.figures.length) ? data.figures
      : ((data.manifest && data.manifest.figures) || []);
    sources.forEach(function (raw, index) {
      var item = raw || {};
      var png = item.png || "";
      if (!png && item.files && item.files.png) {
        var file = String(item.files.png).split("/").pop();
        png = "/api/s5/" + encodeURIComponent(runId) + "/figure/" + encodeURIComponent(file);
      }
      out.push({
        number: item.number != null ? item.number : (index + 1),
        title: item.title || "",
        caption: item.caption || "",
        png: png,
        renderer: item.renderer || "",
        keys: (item.keys || []).join("、")
      });
    });
    return out;
  }

  async function loadS5History(runId, box) {
    box.textContent = "加载中…";
    try {
      var resp = await fetch("/api/s5/" + encodeURIComponent(runId) + "/history");
      var data = await resp.json();
      box.textContent = "";
      var items = data.items || [];
      if (!items.length) {
        box.appendChild(el("p", "detail-note",
          "还没有历史版本；下一次重跑前会自动把当前稿归档。"));
        return;
      }
      var list = el("div", "s5-history-list");
      items.forEach(function (item) {
        var btn = el("button", "s5-history-item",
          (item.stamp || "—") + " · " + (item.figures || 0) + " 图 · "
          + (item.chars || 0) + " 字");
        btn.type = "button";
        btn.addEventListener("click", function () {
          openS5History(runId, item.stamp, box);
        });
        list.appendChild(btn);
      });
      box.appendChild(list);
    } catch (err) {
      box.textContent = "读取历史版本失败：" + (err.message || err);
    }
  }

  async function openS5History(runId, stamp, box) {
    var view = box.querySelector(".s5-history-view");
    if (!view) {
      view = el("div", "s5-history-view");
      box.appendChild(view);
    }
    view.textContent = "加载中…";
    try {
      var resp = await fetch("/api/s5/" + encodeURIComponent(runId)
        + "/history/" + encodeURIComponent(stamp));
      var data = await resp.json();
      if (!data.ok) throw new Error(data.error || "读取失败");
      view.textContent = "";
      var meta = data.meta || {};
      view.appendChild(el("p", "detail-note",
        (meta.archived_at || stamp) + " · " + (data.figures || []).length + " 图"));
      view.appendChild(el("pre", "s5-history-draft", data.draft || ""));
    } catch (err) {
      view.textContent = "读取失败：" + (err.message || err);
    }
  }

  function s5ReviewTone(state) {
    if (state === "已通过" || state === "已交付") return "ok";
    if (state === "待审核" || state === "退回修改") return "warn";
    if (state === "已生成") return "";
    return "";
  }

  function s5ReviewMessage(state) {
    if (state === "待审核") return "扩写完成，等待审核人签名确认。";
    if (state === "退回修改") return "已退回修改；按意见调整后重新扩写。";
    if (state === "已通过") return "审核已通过并签名，可以进入 S6 交付。";
    if (state === "已交付") return "已交付归档。";
    if (state === "已生成") return "旧稿尚未送审，可以先送审再签名。";
    return "当前状态：" + (state || "未知");
  }

  function s5AppendComments(host, comments) {
    var categoryLabels = {
      wording: "措辞", structure: "结构", length: "篇幅", chart: "图表呈现",
      number: "数字", caliber: "口径", omission: "遗漏"
    };
    (comments || []).forEach(function (item, index) {
      var box = el("div", "s5-comment");
      box.appendChild(el("div", "s5-comment-raw",
        (index + 1) + ". " + String(item.raw || "")));
      var meta = [];
      if (item.where) meta.push("位置：" + item.where);
      if (item.expect) meta.push("期望：" + item.expect);
      if (item.back_to) meta.push("归到：" + item.back_to);
      if (item.category) {
        meta.push("类别：" + (categoryLabels[item.category] || item.category));
      }
      if (meta.length) box.appendChild(el("div", "s5-comment-meta", meta.join(" · ")));
      host.appendChild(box);
    });
  }

  function s5ReviewForm(runId, record, host) {
    var form = el("div", "s5-review-form");
    form.appendChild(el("h4", "",
      "签名确认审核（第 " + ((parseInt(record.round, 10) || 0) + 1) + " 轮）"));
    var row = el("div", "s5-review-row");
    row.appendChild(el("label", "", "审核人（签名）"));
    var reviewer = el("input", "");
    reviewer.type = "text";
    reviewer.placeholder = "填写审核人姓名，作为审核签名";
    reviewer.autocomplete = "off";
    try { reviewer.value = localStorage.getItem("s5_reviewer") || ""; } catch (e) {}
    row.appendChild(reviewer);
    form.appendChild(row);

    var decision = el("div", "s5-decision");
    function radio(value, text, checked) {
      var label = el("label", "");
      var input = el("input", "");
      input.type = "radio";
      input.name = "s5ReviewDecision";
      input.value = value;
      input.checked = checked;
      label.appendChild(input);
      label.appendChild(document.createTextNode(text));
      decision.appendChild(label);
      return input;
    }
    radio("pass", "通过", true);
    radio("reject", "退回修改", false);
    form.appendChild(decision);

    var commentBox = el("div", "");
    commentBox.hidden = true;
    var comments = [];
    var commentRows = el("div", "");
    commentBox.appendChild(el("p", "s5-inline-note",
      "退回必须至少写一条具体意见；数字 / 口径 / 遗漏归到 S3，措辞 / 结构 / 篇幅 / 图表呈现归到 S5。"));
    commentBox.appendChild(commentRows);
    var addComment = el("button", "btn btn-ghost btn-sm", "+ 新增意见");
    addComment.type = "button";
    commentBox.appendChild(addComment);
    form.appendChild(commentBox);

    function renderComments() {
      commentRows.textContent = "";
      comments.forEach(function (item) {
        var box = el("div", "s5-comment");
        var head = el("div", "s5-q-head");
        head.appendChild(el("span", "s5-q-id", "意见"));
        var del = el("button", "s5-q-del", "删除");
        del.type = "button";
        del.addEventListener("click", function () {
          comments = comments.filter(function (other) { return other !== item; });
          renderComments();
        });
        head.appendChild(del);
        box.appendChild(head);
        var area = el("textarea", "");
        area.rows = 2;
        area.placeholder = "具体指出哪一段 / 哪个数字有什么问题";
        area.value = item.raw;
        area.addEventListener("input", function () { item.raw = area.value; });
        box.appendChild(area);
        var grid = el("div", "s5-comment-grid");
        var category = el("select", "");
        [["wording", "措辞 → S5"], ["structure", "结构 → S5"], ["length", "篇幅 → S5"],
         ["chart", "图表呈现 → S5"], ["number", "数字 → S3"], ["caliber", "口径 → S3"],
         ["omission", "遗漏 → S3"]].forEach(function (pair) {
          var option = el("option", "", pair[1]);
          option.value = pair[0];
          category.appendChild(option);
        });
        category.value = item.category;
        category.addEventListener("change", function () { item.category = category.value; });
        grid.appendChild(category);
        var where = el("input", "");
        where.type = "text";
        where.placeholder = "位置 / 章节";
        where.value = item.where;
        where.addEventListener("input", function () { item.where = where.value; });
        grid.appendChild(where);
        var expect = el("input", "");
        expect.type = "text";
        expect.placeholder = "期望改成什么";
        expect.value = item.expect;
        expect.addEventListener("input", function () { item.expect = expect.value; });
        grid.appendChild(expect);
        box.appendChild(grid);
        commentRows.appendChild(box);
      });
      if (!comments.length) commentRows.appendChild(el("p", "s5-inline-note", "还没有意见。"));
    }

    function addCommentRow() {
      comments.push({raw: "", category: "wording", where: "", expect: ""});
      renderComments();
    }
    addComment.addEventListener("click", addCommentRow);

    function selectedDecision() {
      var checked = decision.querySelector('input[name="s5ReviewDecision"]:checked');
      return checked ? checked.value : "pass";
    }
    decision.addEventListener("change", function () {
      var reject = selectedDecision() === "reject";
      commentBox.hidden = !reject;
      submit.textContent = reject ? "提交退回意见" : "签名确认审核";
      if (reject && !comments.length) addCommentRow();
    });

    var foot = el("div", "s5-form-foot");
    var submit = el("button", "btn btn-primary btn-sm", "签名确认审核");
    submit.type = "button";
    var msg = el("span", "s5-inline-msg", "");
    foot.appendChild(submit);
    foot.appendChild(msg);
    form.appendChild(foot);
    host.appendChild(form);

    submit.addEventListener("click", function () {
      var name = String(reviewer.value || "").trim();
      if (!name) {
        msg.textContent = "必须填写审核人（签名）。";
        msg.className = "s5-inline-msg error";
        return;
      }
      var choice = selectedDecision();
      var payloadComments = [];
      if (choice === "reject") {
        comments.forEach(function (item) {
          var raw = String(item.raw || "").trim();
          if (!raw) return;
          payloadComments.push({
            raw: raw, category: item.category || "wording",
            where: String(item.where || "").trim(),
            expect: String(item.expect || "").trim()
          });
        });
        if (!payloadComments.length) {
          msg.textContent = "退回必须至少写一条具体意见。";
          msg.className = "s5-inline-msg error";
          return;
        }
        if (!window.confirm("确认退回修改？意见会按类别归到 S3 或 S5。")) return;
      } else if (!window.confirm("确认签名并通过审核？签名与结论会写进审核记录，正文不再修改。")) {
        return;
      }
      try { localStorage.setItem("s5_reviewer", name); } catch (e) {}
      submit.disabled = true;
      msg.textContent = "提交中…";
      msg.className = "s5-inline-msg";
      fetch("/api/s5/" + encodeURIComponent(runId) + "/decision", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          reviewer: name, signature: name, decision: choice, comments: payloadComments
        })
      })
        .then(function (resp) { return resp.json(); })
        .then(function (data) {
          if (!data.ok) throw new Error(data.message || data.error || "提交失败");
          setPipelineStage("s5", {
            state: data.state || "已通过", run: runId, ok: true
          });
          openS5Detail(runId);
        })
        .catch(function (err) {
          submit.disabled = false;
          msg.textContent = err.message || String(err);
          msg.className = "s5-inline-msg error";
        });
    });
  }

  function renderS5Review(runId, data, host) {
    host.textContent = "";
    var status = data.status || {};
    var record = data.record || {};
    var materials = data.materials || {};
    var state = String(status.state || record.state || "");
    var qcInfo = materials.qc || {};
    var qcPayload = qcInfo.payload || data.qc || {};
    var qcFailed = String(qcPayload.verdict || "") === "FAIL"
      && qcInfo.available !== false;
    var showQcFailure = qcFailed && ["", "可扩写", "已生成"].indexOf(state) >= 0;
    var shownState = showQcFailure ? "质检未通过" : state;
    host.appendChild(el("h4", "", "审核"));

    var bar = el("div", "s5-review-state");
    bar.appendChild(el("span", "s5-review-badge "
      + (showQcFailure ? "stop" : s5ReviewTone(state)),
      shownState || "未送审"));
    var message = showQcFailure
      ? ("自动质检 " + (qcPayload.summary || qcInfo.summary || "未通过")
         + "；未送审，签名入口不会出现。先按下方 AI 复核意见修改，"
         + "质检通过后才会进入待审核。")
      : (status.note || s5ReviewMessage(state));
    bar.appendChild(el("span", "s5-review-msg", message));
    host.appendChild(bar);
    if (showQcFailure) {
      host.appendChild(el("p", "s5-inline-note",
        "质检未通过 → 未送审 → 没有签名。签名只在状态变为「待审核」后出现；"
        + "回到聊天，让助手按质检意见定点修改即可，不必重跑扩写。"));
    }

    var meta = [];
    if (record.reviewer) meta.push("审核人：" + record.reviewer);
    if (record.signature) meta.push("签名：" + record.signature);
    if (record.at) meta.push("时间：" + record.at);
    if (meta.length) host.appendChild(el("p", "s5-review-meta", meta.join("　·　")));

    var previous = materials.previous_review;
    if (previous && (previous.comments || []).length) {
      host.appendChild(el("p", "s5-inline-note", "上一轮审核意见"));
      s5AppendComments(host, previous.comments);
    }

    var sections = materials.sections || [];
    var unconfirmed = materials.unconfirmed || [];
    if (sections.length || unconfirmed.length) {
      var box = el("details", "s5-review-materials");
      box.appendChild(el("summary", "", "送审材料：章节首句 "
        + sections.length + " 条 · 未确认 " + unconfirmed.length + " 条"));
      var inner = el("div", "s5-material-body");
      if (sections.length) {
        var list = el("ul", "s5-material-list");
        sections.slice(0, 10).forEach(function (item) {
          var li = el("li", "");
          li.appendChild(el("b", "", String(item.heading || "正文")));
          li.appendChild(document.createTextNode("　" + String(item.first || "")));
          list.appendChild(li);
        });
        inner.appendChild(list);
      }
      if (unconfirmed.length) {
        inner.appendChild(el("p", "s5-inline-note", "未确认事项"));
        unconfirmed.slice(0, 8).forEach(function (item) {
          inner.appendChild(el("p", "s5-inline-note",
            (item.id || "—") + " · " + (item.original || item.fixed || "")
            + (item.reason ? "（" + item.reason + "）" : "")));
        });
      }
      box.appendChild(inner);
      host.appendChild(box);
    }

    if (state === "待审核" && String(record.state || "") === "待审核") {
      s5ReviewForm(runId, record, host);
      return;
    }
    if (state === "已生成") {
      var submit = el("button", "btn btn-ghost btn-sm", "送审旧稿");
      submit.type = "button";
      var msg = el("span", "s5-inline-msg", "");
      submit.addEventListener("click", function () {
        submit.disabled = true;
        msg.textContent = "送审中…";
        fetch("/api/s5/" + encodeURIComponent(runId) + "/submit", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: "{}"
        })
          .then(function (resp) { return resp.json(); })
          .then(function (result) {
            if (!result.ok) throw new Error(result.message || result.error || "送审失败");
            openS5Detail(runId);
          })
          .catch(function (err) {
            submit.disabled = false;
            msg.textContent = err.message || String(err);
            msg.className = "s5-inline-msg error";
          });
      });
      var row = el("div", "s5-form-foot");
      row.appendChild(submit);
      row.appendChild(msg);
      host.appendChild(row);
      return;
    }
    if (state === "已通过" || state === "已交付" || state === "退回修改") {
      host.appendChild(el("p", "s5-inline-note",
        "结论：" + (state === "退回修改" ? "退回修改" : "通过")
        + "　·　签名：" + (record.signature || record.reviewer || "—")
        + "　·　时间：" + (record.at || "—")));
      if ((record.comments || []).length) {
        host.appendChild(el("p", "s5-inline-note", "审核意见"));
        s5AppendComments(host, record.comments);
      }
      if (state === "已通过" || state === "已交付") {
        var link = s6LinkButton(runId,
          state === "已交付" ? "查看交付包" : "去第六步生成交付包");
        host.appendChild(link);
      }
    }
  }

  function s5ReviewButton(runId, state, reviewHost) {
    if (state === "已通过") return s6LinkButton(runId, "去第六步生成交付包");
    if (state === "已交付") return s6LinkButton(runId, "查看交付包");
    if (state === "可扩写" || state === "退回修改") return null;
    var btn = el("button", "btn btn-ghost btn-sm",
      state === "待审核" ? "签名确认审核" : (state === "已生成" ? "送审并审核" : "去审核"));
    btn.type = "button";
    btn.title = "在聊天里完成审核";
    btn.addEventListener("click", function () {
      if (state === "已生成") {
        btn.disabled = true;
        btn.textContent = "送审中…";
        fetch("/api/s5/" + encodeURIComponent(runId) + "/submit", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: "{}"
        })
          .then(function (resp) { return resp.json(); })
          .then(function (data) {
            if (!data.ok) throw new Error(data.message || data.error || "送审失败");
            openS5Detail(runId);
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = "送审并审核";
            appendMessage("error", "送审失败：" + (err.message || err));
          });
        return;
      }
      if (reviewHost) {
        reviewHost.scrollIntoView({behavior: "smooth", block: "center"});
        var input = reviewHost.querySelector("input[type=text]");
        if (input) input.focus({preventScroll: true});
      }
    });

  }

  function s6LinkButton(runId, label) {
    var btn = el("button", "btn btn-ghost btn-sm", label);
    btn.type = "button";
    btn.addEventListener("click", function () { openS6Detail(runId); });
    return btn;
  }

  function s6FmtBytes(value) {
    var size = Number(value || 0);
    if (size < 1024) return size + " B";
    if (size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
    return (size / 1024 / 1024).toFixed(1) + " MB";
  }

  function s6DownloadFile(url, name, btn) {
    if (!url) return;
    var label = btn.textContent;
    btn.textContent = "下载中…";
    btn.disabled = true;
    fetch(url)
      .then(function (resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.blob();
      })
      .then(function (blob) {
        var href = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = href;
        link.download = String(name || "download").split("/").pop();
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(href); }, 1000);
        btn.textContent = label;
        btn.disabled = false;
      })
      .catch(function (err) {
        btn.textContent = "下载失败";
        btn.title = err.message || String(err);
        setTimeout(function () {
          btn.textContent = label;

      });

  function s6Deliver(runId, btn, msg) {
    if (!window.confirm("现在生成交付包？会按当前内容出版本，同内容不会重复生成。")) return;
    btn.disabled = true;
    var label = btn.textContent;
    btn.textContent = "生成中…";
    msg.textContent = "正在排版、生成 Word 并打包…";
    msg.className = "s6-inline-msg";
    fetch("/api/s6/" + encodeURIComponent(runId) + "/deliver", {method: "POST"})
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error(data.message || data.error || "交付失败");
        setPipelineStage("s6", {state: data.state || "已交付", run: runId, ok: true});
        return fetch("/api/s6/" + encodeURIComponent(runId), {cache: "no-store"})
          .then(function (resp) { return resp.json(); })
          .then(function (view) {
            if (view && view.ok) renderS6Detail(view, runId);
          });
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = label;
        msg.textContent = err.message || String(err);
        msg.className = "s6-inline-msg error";
      });
  }

  function renderS5AiReview(data, body) {
    var materials = data.materials || {};
    var qc = materials.qc || {};
    var payload = qc.payload || {};
    var ai = payload.ai_review || {};
    var filtered = materials.filtered_discoveries || {};
    var section = detailSection("AI 复核与自动质检");
    section.classList.add("s5-ai-review");

    var verdict = payload.verdict || qc.verdict || "—";
    var source = payload.business_source === "ai" ? "pandasai（代码复核一致）" : "代码复核值";
    section.appendChild(el("p", "detail-note",
      "自动质检：" + verdict + " " + (payload.summary || qc.summary || "")
      + "；业务取数来源：" + source));

    var aiText = "AI 复核：";
    if (!Object.keys(ai).length) {
      aiText += "本轮无记录";
    } else if (ai.skipped) {
      aiText += "跳过（" + (ai.reason || "未返回结论") + "）";
    } else {
      aiText += ai.ok ? "通过" : "未通过";
      if ((ai.waived || []).length) {
        aiText += "（用户豁免 " + ai.waived.length + " 条）";
      }
    }
    section.appendChild(el("p", "detail-note", aiText));
    if ((ai.waived || []).length) {
      section.appendChild(el("p", "s5-inline-note",
        "用户已判定为误判、不再作为不通过理由：" + ai.waived.join("；")));
    }

    function addList(title, items) {
      if (!items || !items.length) return;
      section.appendChild(el("p", "detail-note", title));
      items.forEach(function (text) {
        section.appendChild(el("p", "s5-draft", "· " + text));
      });
    }
    addList("AI 复核问题", ai.issues || []);
    addList("AI 复核建议", ai.suggestions || []);

    var queries = Array.isArray(ai.queries) ? ai.queries : [];
    if (queries.length) {
      section.appendChild(el("p", "detail-note",
        "AI 调 pandasai 复核（" + queries.length + " 次）"));
      var qTable = el("table", "s5-disc");
      var qHead = el("thead", "");
      var qRow = el("tr", "");
      ["问题", "结果"].forEach(function (h) { qRow.appendChild(el("th", "", h)); });
      qHead.appendChild(qRow);
      qTable.appendChild(qHead);
      var qBody = el("tbody", "");
      queries.forEach(function (item) {
        var req = item.request || {};
        var res = item.result || {};
        var result = res.ok
          ? (res.value !== null && res.value !== undefined ? String(res.value)
             : (res.display || (Array.isArray(res.rows) ? res.rows.length + " 行" : "—")))
          : "失败：" + (res.error || "—");
        var tr = el("tr", "");
        [req.question || "—", result].forEach(function (cell) {
          tr.appendChild(el("td", "", cell));
        });
        qBody.appendChild(tr);
      });
      qTable.appendChild(qBody);
      section.appendChild(qTable);
    }

    var checks = Array.isArray(payload.checks) ? payload.checks : [];
    if (checks.length) {
      section.appendChild(el("p", "detail-note", "代码质检明细"));
      checks.forEach(function (check) {
        section.appendChild(el("p", "detail-note",
          (check.ok ? "通过" : "未通过") + " · "
          + (check.name || "") + "：" + (check.detail || "")));
      });
    }

    var filterQ = (filtered.questions || []).length;
    var filterF = (filtered.findings || []).length;
    if (filterQ || filterF) {
      section.appendChild(el("p", "detail-note",
        "被正文过滤、已交给 AI 复核：问题 " + filterQ + " 条，发现 " + filterF + " 条"));
    }
    body.appendChild(section);
  }

      "S5 以 S4 修正稿为骨架逐句保留，借助模型探索数据、按需出图，并在骨架上补数据发现；完成后自动送审。"));
    s5DetailFoot.textContent = "";
    s5DetailFoot.appendChild(el("span", "detail-foot-hint",
      "需要模型写作；S4 状态须为可扩写。"));
    var btn = el("button", "btn btn-primary btn-sm", "开始扩写");
    btn.type = "button";
    btn.addEventListener("click", function () { runS5(runId, btn); });
    s5DetailFoot.appendChild(btn);
    s5DetailFoot.hidden = false;
  }

  function syncS5FromServer(runId) {
    if (!runId) return;
    fetch("/api/s5/" + encodeURIComponent(runId))
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (data && data.running) {
          pipeline.s5 = { state: "扩写中", run: runId, ok: true };
          savePipeline();
          renderPipeline();
          return;
        }
        if (!data.ok || !data.draft) return;
        var statusState = String((data.status || {}).state || "待审核");
        var matsQc = (data.materials && data.materials.qc) || {};
        var qcPayload = matsQc.payload || data.qc || {};
        var qcFailed = String(qcPayload.verdict || "") === "FAIL"
          && matsQc.available !== false;
        var state = (qcFailed && ["可扩写", "已生成"].indexOf(statusState) >= 0)
          ? "质检未通过" : statusState;
        pipeline.s5 = { state: state, run: runId,
          ok: state === "已通过" || state === "已交付" };
        if (state === "已交付") {
          pipeline.s6 = { state: "已交付", run: runId, ok: true };
        }
        savePipeline();
        renderPipeline();
      })
      .catch(function () {});
  }

  function renderS5Running(runId, data) {
    var body = s5DetailBody;
    body.textContent = "";
    body.scrollTop = 0;
    var bar = el("div", "detail-state warn");
    bar.appendChild(el("span", "d-state-badge", "扩写中"));
    bar.appendChild(el("span", "detail-state-msg",
      "正在扩写… 关闭弹窗不会中断，完成后自动刷新。"));
    body.appendChild(bar);
    if (data && data.draft) {
      body.appendChild(el("p", "detail-note", "当前显示的是上一版，完成后会自动替换。"));
    }
    s5DetailFoot.textContent = "";
    var btn = el("button", "btn btn-primary btn-sm", "扩写中…");
    btn.type = "button";
    btn.disabled = true;
    s5DetailFoot.appendChild(btn);
    s5DetailFoot.hidden = false;
    setPipelineStage("s5", { state: "扩写中", run: runId, ok: true });
    startS5Polling(runId);
  }

  async function openS5Detail(runId) {
    if (!runId) return;
    stopS5Polling();
    s5DetailTitle.textContent = "S5 · " + String(runId).toUpperCase();
    s5DetailBody.textContent = "正在读取…";
    s5DetailFoot.textContent = "";
    s5DetailFoot.hidden = true;
    if (!s5DetailDialog.open) s5DetailDialog.showModal();
    try {
      var resp = await fetch("/api/s5/" + encodeURIComponent(runId));
      var data = await resp.json();
      if (data.running) {
        renderS5Running(runId, data);
        return;
      }
      if (data.ok && data.draft) {
        setPipelineStage("s5", {
          state: String((data.status || {}).state || "待审核"), run: runId, ok: true
        });
        renderS5Detail(data, runId);
      } else {
        renderS5Empty(runId, data.error || "这次运行还没扩写。");
      }
    } catch (err) {
      s5DetailBody.textContent = "读取失败：" + (err.message || err);
    }
  }

  async function runS5(runId, btn) {
    if (!runId) return;
    var label = btn.textContent;
    stopS5Polling();
    setPipelineStage("s5", { state: "扩写中", run: runId, ok: true });
    btn.disabled = true;
    btn.textContent = "扩写中…（约 20–60 秒）";
    try {
      var resp = await fetch("/api/s5", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ run_id: runId, full: true })
      });
      var data = await resp.json();
      if (!data.ok) throw new Error(data.message || data.error || "扩写失败");
      stopS5Polling();
      setPipelineStage("s5", { state: data.state || "待审核", run: data.run_id || runId, ok: true });
      var view = {
        ok: true, state: data.state || "", message: data.message || "",
        status: data.status || { state: data.state || "" },
        draft: data.draft || "", stats: data.stats || {},
        manifest: data.manifest || {}, figures: data.figures || [],
        hotspots: data.hotspots || [], week: data.week || "",
        discoveries: data.discoveries || [], skeleton: data.skeleton || []
      };
      renderS5Detail(view, data.run_id || runId);
      if (data.message) appendMessage("assistant", data.message);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = label;
      if (String(err.message || "").indexOf("正在运行") >= 0) {
        openS5Detail(runId);
      } else {
        s5Error("扩写失败：" + (err.message || err));
      }
    }
  }

  function updateS1Pill(tag, state) {
    var pills = messages.querySelectorAll(".event-link");
    Array.prototype.forEach.call(pills, function (pill) {
      if (pill.getAttribute("data-run") === String(tag)) {
        pill.setAttribute("data-state", state || "");
        var circle = pill.querySelector(".event-status");
        if (circle) circle.className = "event-status " + stateTone(state);
        var bar = pill.parentNode;
        if (bar) {
          var extras = bar.querySelectorAll(".event-override");
          Array.prototype.forEach.call(extras, function (extra) { extra.remove(); });
        }
      }
    });
  }

  async function overrideRun(tag, state, btn) {
    var ok = await askConfirm(
      "人工放权？",
      "S1 原始状态为「" + state + "」。放行后可以继续 S2，但原始问题会保留在记录里，相关结论无法用数据核实。",
      "确认放权"
    );
    if (!ok) return;
    btn.disabled = true;
    btn.textContent = "放权中…";
    try {
      var resp = await fetch("/api/runs/" + encodeURIComponent(tag) + "/waive", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          override: true,
          items: [],
          reason: "用户在 S1 详情中确认人工放权",
          session_id: sessionId || ""
        })
      });
      var data = await resp.json();
      if (!data.ok) throw new Error(data.error || "放权失败");
      setPipelineStage("s1", {
        state: (data.intake || {}).state || "准入通过",
        run: tag,
        ok: true
      });
      renderRunDetail(data.intake || {});
      if (data.note) appendMessage("assistant", data.note);
    } catch (err) {
      var label = (btn.classList.contains("pipeline-override") || btn.classList.contains("event-override")) ? "放权" : "人工放权";
      btn.disabled = false;
      btn.textContent = label;
      var text = "放权失败：" + (err.message || err);
      if (runDetailDialog.open) {
        var note = el("p", "detail-note", text);
        runDetailBody.insertBefore(note, runDetailBody.firstChild);
        runDetailBody.scrollTop = 0;
      } else {
        appendMessage("error", text);
      }
    }
  }

  function appendEvents(events, msg) {
    if (!events || !events.length) return;
    var host = msg.querySelector(".msg-body") || msg;
    var bar = el("div", "events");
    events.forEach(function (ev) {

        pill.appendChild(dot);

      pill.appendChild(document.createTextNode(TOOL_LABELS[ev.tool] || ev.tool || "tool"));

      } else {
        pill.title = [ev.tool, ev.run_id, ev.state].filter(Boolean).join(" · ");
      }

        var overrideBtn = el("button", "event-override", "放权");
        overrideBtn.type = "button";
        overrideBtn.title = "人工放权并重跑 S1";
        overrideBtn.addEventListener("click", function () {
          overrideRun(ev.run_id, ev.state, overrideBtn);
        });

      }
    });

  function ensureToolTimer(target) {
    if (target.toolTimer) return;
    target.toolTimer = setInterval(function () {
      var rows = target.toolList ? target.toolList.querySelectorAll(".tool-row.running") : [];
      if (!rows.length) {
        clearInterval(target.toolTimer);
        target.toolTimer = null;
        return;
      }
      Array.prototype.forEach.call(rows, function (row) {
        var started = Number(row.getAttribute("data-start") || 0);
        var time = row.querySelector(".tool-time");
        if (time && started) time.textContent = ((Date.now() - started) / 1000).toFixed(1) + "s";
      });
    }, 100);
  }

  function startToolRow(target, ev) {
    if (!target.toolList) return;
    target.toolList.hidden = false;
    var callId = ev.call_id || "";
    var row = el("div", "tool-row running");
    row.setAttribute("data-call", callId);
    row.setAttribute("data-tool", ev.tool || "");
    row.setAttribute("data-start", String(Date.now()));
    row.appendChild(el("span", "tool-spinner"));
    row.appendChild(el("span", "tool-name", TOOL_LABELS[ev.tool] || ev.tool || "工具"));
    var hint = toolHint(ev.tool, ev.args);
    if (hint) row.appendChild(el("span", "tool-hint", hint));
    row.appendChild(el("span", "tool-time", "0.0s"));
    target.toolList.appendChild(row);
    ensureToolTimer(target);
    if (isNearBottom()) scrollToBottom();
  }

  function finishToolRow(target, ev) {
    if (!target.toolList) return;
    var rows = target.toolList.querySelectorAll(".tool-row.running");
    var row = null;
    Array.prototype.forEach.call(rows, function (item) {
      if (row) return;
      if (ev.call_id && item.getAttribute("data-call") === ev.call_id) row = item;
    });
    if (!row) {
      Array.prototype.forEach.call(rows, function (item) {
        if (!row && item.getAttribute("data-tool") === (ev.tool || "")) row = item;
      });
    }
    if (!row && rows.length) row = rows[rows.length - 1];
    if (!row) {
      startToolRow(target, {tool: ev.tool, args: {}, call_id: ev.call_id});
      row = target.toolList.lastElementChild;
    }
    row.classList.remove("running");
    row.classList.add(ev.ok ? "done" : "error");
    var spinner = row.querySelector(".tool-spinner");
    if (spinner) spinner.remove();
    row.insertBefore(el("span", "tool-mark", ev.ok ? "✓" : "!"), row.firstChild);
    var time = row.querySelector(".tool-time");
    if (time && ev.elapsed_ms) time.textContent = (ev.elapsed_ms / 1000).toFixed(1) + "s";
    if (!ev.ok && ev.error) {
      var hint = row.querySelector(".tool-hint");
      if (hint) hint.textContent = ev.error;
      else row.appendChild(el("span", "tool-hint", ev.error));
    }
    row.title = [ev.tool, ev.run_id, ev.state, ev.error].filter(Boolean).join(" · ");
    if (!target.toolList.querySelector(".tool-row.running")) {
      if (target.toolTimer) {
        clearInterval(target.toolTimer);
        target.toolTimer = null;
      }
      if (target.thinkingLabel) target.thinkingLabel.textContent = "正在整理结果…";
      if (sendLabel && pendingStreamIdle(target)) sendLabel.textContent = "整理中";
    }
    if (isNearBottom()) scrollToBottom();
  }

  function pendingStreamIdle(target) {
    return !target.streamContent || target.streamContent.hidden;
  }

  function settleToolRows(target) {
    if (!target.toolList) return;
    var rows = target.toolList.querySelectorAll(".tool-row.running");
    Array.prototype.forEach.call(rows, function (row) {
      row.classList.remove("running");
      row.classList.add("done");
      var spinner = row.querySelector(".tool-spinner");
      if (spinner) spinner.remove();
      if (!row.querySelector(".tool-mark")) {
        row.insertBefore(el("span", "tool-mark", "✓"), row.firstChild);
      }
    });
    if (target.toolTimer) {
      clearInterval(target.toolTimer);
      target.toolTimer = null;
    }
  }

    trace.appendChild(detail);

    msg.appendChild(body);

    if (stick) scrollToBottom();
    return {
      wrap: msg, trace: trace, title: title, meta: meta, list: list, detail: detail,
      thinking: thinking, thinkingLabel: thinkingLabel, thinkingText: thinkingText,
      toolList: toolList, toolTimer: null, streamContent: streamContent,
      finished: false
    };
  }

  function renderProgress(target, data) {
    var states = data.states || [];
    var total = (data.steps || []).length || 8;
    target.title.textContent = "执行过程";
    if (data.started) {
      target.trace.hidden = false;
      // 没有思考原文时，用步骤本身表示进行中，避免重复一行「正在思考」
      if (!target.thinkingText.textContent) target.thinking.hidden = true;
    }
    target.list.textContent = "";
    var detailInlined = false;
    (data.steps || []).forEach(function (name, index) {
      var state = states[index] || "pending";
      if (state === "pending") return;
      var item = el("li", "step " + state);
      var dot = el("span", "dot");
      if (state === "done") dot.innerHTML = CHECK;
      item.appendChild(dot);
      var stepBody = el("span", "step-body");
      stepBody.appendChild(el("span", "name", name));
      if (state === "active" && !data.finished && data.detail) {
        stepBody.appendChild(el("span", "step-detail", data.detail));
        detailInlined = true;
      }
      item.appendChild(stepBody);
      target.list.appendChild(item);
    });
    if (data.finished) {
      target.meta.textContent = "已完成";
      target.trace.classList.add("done");
      target.detail.hidden = true;
      target.detail.textContent = "";
      if (!target.finished) {
        target.finished = true;
        target.trace.open = false;
      }
    } else if (data.started) {
      target.meta.textContent = "进行中 · " + Math.min((data.current || 0) + 1, total) + "/" + total;
      target.detail.hidden = detailInlined;
      target.detail.textContent = detailInlined ? "" : (data.detail || "进行中…");
    } else {
      target.meta.textContent = "准备中…";
      target.detail.hidden = true;
      target.detail.textContent = "";
    }
    if (isNearBottom()) scrollToBottom();
  }

  function pollProgress(target) {
    if (!sessionId) return Promise.resolve();
    return fetch("/api/chat/progress?session_id=" + encodeURIComponent(sessionId))
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (!data.ok) return;
        if (!data.started && !(data.thoughts || []).length) return;
        target.last = data;
        renderProgress(target, data);
      })
      .catch(function () {});
  }

  // ---- 会话持久化 ----
  var SESSION_KEY = "weekly_report_session";

  function remember(id) {
    try { localStorage.setItem(SESSION_KEY, id || ""); } catch (e) {}
  }
  function recall() {
    try { return localStorage.getItem(SESSION_KEY) || ""; } catch (e) { return ""; }
  }

  async function restoreSession(id) {
    var resp = await fetch("/api/chat/history/" + encodeURIComponent(id));
    var data = await resp.json();
    if (!data.ok) {
      remember("");
      throw new Error(data.error || "恢复失败");
    }
    sessionId = data.session_id;
    loadPipeline();
    renderPipeline();
    var syncRun = data.run_id || (pipeline.s5 && pipeline.s5.run)
      || (pipeline.s4 && pipeline.s4.run) || (pipeline.s3 && pipeline.s3.run) || "";
    syncPipelineFromServer(syncRun).then(function () {
      if (!syncRun) return;
      syncS4FromServer(syncRun);
      syncS5FromServer(syncRun);
    });
    boundNames = data.files || [];
    setBound(boundNames.length
      ? "本次会话已绑定：" + boundNames.join("、")
      : "这个对话没有附件，可重新选择文件");
    picked = [];
    renderChips();
    renderWelcome();
    (data.messages || []).forEach(function (m) {
      appendMessage(m.role === "user" ? "user" : "assistant", m.text);
    });
    remember(sessionId);
    scrollToBottom();
  }

  function closeHistory() {
    if (historyDialog.open) historyDialog.close();
  }

  function askConfirm(title, text, label) {
    return new Promise(function (resolve) {
      confirmResolve = resolve;
      confirmTitle.textContent = title;
      confirmText.textContent = text;
      confirmYes.textContent = label || "确定";
      confirmDialog.returnValue = "";
      if (!confirmDialog.open) confirmDialog.showModal();
      confirmNo.focus();
    });
  }

  function showHistoryError(text) {
    var old = historyList.querySelector(".hist-error");
    if (old) old.remove();
    historyList.insertBefore(el("p", "hist-error", text), historyList.firstChild);
  }

  function startNewChat() {
    if (sendBtn.disabled) return;
    sessionId = null;
    pipeline = emptyPipeline();
    renderPipeline();
    boundNames = [];
    picked = [];
    renderChips();
    setBound("");
    remember("");
    input.value = "";
    resizeInput();
    renderWelcome();
    closeHistory();
    input.focus();
  }

  function openHistory() {
    if (!historyDialog.open) historyDialog.showModal();
    document.body.classList.add("drawer-open");
    historyList.textContent = "";
    drawerClose.focus();
    fetch("/api/chat/history")
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        var sessions = data.sessions || [];
        if (!sessions.length) {
          historyList.appendChild(el("p", "hist-empty", "还没有保存过的对话。"));
          return;
        }
        sessions.forEach(function (item) {
          var row = el("div", "hist-item" + (item.session_id === sessionId ? " active" : ""));
          var main = el("button", "hist-main");
          main.type = "button";
          main.appendChild(el("div", "hist-preview", item.preview || "（无文字）"));
          var meta = [
            item.updated_at ? item.updated_at.replace("T", " ").slice(5, 16) : "",
            (item.files || []).length + " 个文件",
            item.turns + " 轮"
          ].filter(Boolean).join(" · ");
          main.appendChild(el("div", "hist-meta", meta));
          main.addEventListener("click", async function () {
            if (item.session_id === sessionId) { closeHistory(); return; }
            try {
              clearMessages();
              sessionId = null;
              await restoreSession(item.session_id);
              closeHistory();
            } catch (err) {
              closeHistory();
              appendMessage("error", "切换失败：" + (err.message || err));
            }
          });
          row.appendChild(main);

          var del = el("button", "hist-del");
          del.type = "button";
          del.title = "删除这个对话";
          del.setAttribute("aria-label", "删除这个对话");
          del.innerHTML = TRASH;
          del.disabled = sendBtn.disabled;
          del.addEventListener("click", async function (event) {
            event.stopPropagation();
            if (sendBtn.disabled) return;
            var preview = String(item.preview || "（无文字）");
            if (preview.length > 40) preview = preview.slice(0, 40) + "…";
            var ok = await askConfirm(
              "删除这个对话？",
              "「" + preview + "」删除后不可恢复，消息和附件都会一起删除。",
              "删除"
            );
            if (!ok) return;
            del.disabled = true;
            try {
              var resp = await fetch("/api/chat/delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: item.session_id })
              });
              var data = await resp.json();
              if (!data.ok) throw new Error(data.error || "删除失败");
              if (item.session_id === sessionId) {
                startNewChat();
              } else {
                row.remove();
                if (!historyList.querySelector(".hist-item")) {
                  historyList.appendChild(el("p", "hist-empty", "还没有保存过的对话。"));
                }
              }
            } catch (err) {
              del.disabled = false;
              showHistoryError("删除失败：" + (err.message || err));
            }
          });
          row.appendChild(del);
          historyList.appendChild(row);
        });
      })
      .catch(function (err) {
        historyList.appendChild(el("p", "hist-empty", "读取失败：" + err.message));
      });
  }

  function clearMessages() {
    renderWelcome();

  confirmNo.addEventListener("click", function () { confirmDialog.close("cancel"); });
  confirmYes.addEventListener("click", function () { confirmDialog.close("confirm"); });
  confirmDialog.addEventListener("click", function (event) {
    if (event.target === confirmDialog) confirmDialog.close("cancel");
  });
  confirmDialog.addEventListener("close", function () {
    var ok = confirmDialog.returnValue === "confirm";
    confirmDialog.returnValue = "";
    if (confirmResolve) {
      var done = confirmResolve;
      confirmResolve = null;
      done(ok);
    }
  });

  runDetailClose.addEventListener("click", function () { runDetailDialog.close(); });
  runDetailDialog.addEventListener("click", function (event) {
    if (event.target === runDetailDialog) runDetailDialog.close();
  });

  s2DetailClose.addEventListener("click", function () { s2DetailDialog.close(); });
  s2DetailDialog.addEventListener("click", function (event) {
    if (event.target === s2DetailDialog) s2DetailDialog.close();
  });

  s3DetailClose.addEventListener("click", function () { s3DetailDialog.close(); });
  s3DetailDialog.addEventListener("click", function (event) {
    if (event.target === s3DetailDialog) s3DetailDialog.close();
  });

  s4DetailClose.addEventListener("click", function () { s4DetailDialog.close(); });
  s4DetailDialog.addEventListener("click", function (event) {
    if (event.target === s4DetailDialog) s4DetailDialog.close();
  });

  s5DetailClose.addEventListener("click", function () { stopS5Polling(); s5DetailDialog.close(); });
  s5DetailDialog.addEventListener("click", function (event) {
    if (event.target === s5DetailDialog) s5DetailDialog.close();
  });
  s6DetailClose.addEventListener("click", function () { s6DetailDialog.close(); });
  s6DetailDialog.addEventListener("click", function (event) {
    if (event.target === s6DetailDialog) s6DetailDialog.close();
  });

  function setBusy(busy) {
    sendBtn.disabled = busy;
    sendBtn.classList.toggle("busy", busy);
    sendBtn.setAttribute("aria-busy", busy ? "true" : "false");
    if (sendLabel) sendLabel.textContent = busy ? "思考中" : "发送";
    if (newChatBtn) newChatBtn.disabled = busy;
  }

  function consumeStream(resp, pending) {
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = "";
    var finalData = null;
    var failure = null;

    function handle(event) {
      if (!event || typeof event !== "object") return;
      if (event.type === "reasoning") {
        var reasoning = event.delta || "";
        if (!reasoning) return;
        pending.thinking.hidden = false;
        if (pending.thinkingText.hidden) pending.thinkingText.hidden = false;
        pending.thinkingText.textContent += reasoning;
        pending.thinkingText.scrollTop = pending.thinkingText.scrollHeight;
        if (isNearBottom()) scrollToBottom();
      } else if (event.type === "content") {
        var content = event.delta || "";
        if (!content) return;
        pending.streamContent.hidden = false;
        pending.streamContent.textContent += content;
        if (sendLabel && sendLabel.textContent === "思考中") sendLabel.textContent = "输出中";
        if (isNearBottom()) scrollToBottom();
      } else if (event.type === "tool_start") {
        pending.thinking.hidden = false;
        if (pending.thinkingLabel) pending.thinkingLabel.textContent = "正在调用工具…";
        startToolRow(pending, event);
        if (sendLabel) sendLabel.textContent = "执行中";
      } else if (event.type === "tool_end") {
        finishToolRow(pending, event);
      } else if (event.type === "content_reset") {
        pending.streamContent.textContent = "";
        pending.streamContent.hidden = true;
        if (sendLabel) {
          sendLabel.textContent = pending.toolList
            && pending.toolList.querySelector(".tool-row.running") ? "执行中" : "思考中";
        }
      } else if (event.type === "done") {
        settleToolRows(pending);
        finalData = event;
      } else if (event.type === "error") {
        failure = new Error(event.error || "助手调用失败");
      }
    }

    function parseLine(line) {
      if (line.charAt(line.length - 1) === "\r") line = line.slice(0, -1);
      if (line.indexOf("data:") !== 0) return;
      var raw = line.slice(5).trim();
      if (!raw) return;
      var event;
      try { event = JSON.parse(raw); } catch (e) { return; }
      handle(event);
    }

    return (async function () {
      while (true) {
        var step = await reader.read();
        if (step.done) break;
        buffer += decoder.decode(step.value, { stream: true });
        var index;
        while ((index = buffer.indexOf("\n")) >= 0) {
          parseLine(buffer.slice(0, index));
          buffer = buffer.slice(index + 1);
        }
        if (failure) {
          try { await reader.cancel(); } catch (e) {}
          throw failure;
        }
      }
      if (buffer.trim()) parseLine(buffer);
      if (failure) throw failure;
      if (!finalData) throw new Error("连接中断，没有收到完成信号");
      return finalData;
    })();
  }

  async function send() {
    if (sendBtn.disabled) return;
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    appendMessage("user", text);
    setBusy(true);
    var pending = appendProgress();
    var timer = null;
    try {
      await ensureSession();
      await syncFiles();
      timer = setInterval(function () { pollProgress(pending); }, 350);
      var resp = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "text/event-stream"
        },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      var type = resp.headers.get("content-type") || "";
      if (!resp.ok || type.indexOf("text/event-stream") < 0) {
        var errorData = null;
        try { errorData = await resp.json(); } catch (e) {}
        throw new Error((errorData && errorData.error) || "助手调用失败");
      }
      var finalData = await consumeStream(resp, pending);
      if (timer) clearInterval(timer);
      if (pending.toolTimer) {
        clearInterval(pending.toolTimer);
        pending.toolTimer = null;
      }
      await pollProgress(pending);

      var usedS1 = (finalData.events || []).some(function (e) { return e.tool === "run_s1"; });
      var reply = finalData.reply || pending.streamContent.textContent || "（没有返回内容）";
      pending.streamContent.textContent = "";
      pending.streamContent.classList.remove("stream-content");
      renderRich(pending.streamContent, reply);
      if (!pending.streamContent.childNodes.length) pending.streamContent.textContent = reply;
      pending.streamContent.hidden = false;

      // 输出完成：思考过程淡出并移除
      pending.thinking.classList.add("fade");
      setTimeout(function () {
        if (pending.thinking.parentNode) pending.thinking.remove();
      }, 200);

      if (usedS1 && pending.list.querySelector(".step")) {
        pending.trace.hidden = false;
        pending.meta.textContent = "已完成";
        pending.trace.classList.add("done");
        pending.trace.open = false;
        pending.detail.hidden = true;
      } else {
        pending.trace.remove();
      }
      updatePipelineFromEvents(finalData.events);
      if (finalData.run_id) syncPipelineFromServer(finalData.run_id);
      if (isNearBottom()) scrollToBottom();
    } catch (err) {
      if (timer) clearInterval(timer);
      if (pending.toolTimer) clearInterval(pending.toolTimer);
      pending.wrap.remove();
      appendMessage("error", err.message || String(err));
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      if (event.isComposing) return;
      event.preventDefault();
      send();
    }
  });
  input.addEventListener("input", resizeInput);

  renderWelcome();
  renderPipeline();
  resizeInput();

  var savedId = recall();
  if (savedId) {
    restoreSession(savedId).catch(function () {
      remember("");
      setBound("上次的对话没找到，重新选文件即可开始。");
    });
  }
})();
</script>
