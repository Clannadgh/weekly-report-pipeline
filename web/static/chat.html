<!doctype html>
<html lang="zh-CN" data-theme="weekly">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>经营周报助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f5bd6'/%3E%3Cpath d='M10 22v-6M16 22V9M22 22v-4' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- 组件底座：DaisyUI 5（MIT），本地 vendor，离线可用 -->
<link rel="stylesheet" href="/static/vendor/daisyui.css">
<link rel="stylesheet" href="/static/theme.css">
<style>
/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:28px;
  height:60px;padding:0 24px;
  background:rgba(255,254,252,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.01em}
.brand:hover{color:var(--ink)}
.brand-name{white-space:nowrap}
.brand-mark{
  width:28px;height:28px;flex:none;border-radius:9px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#6b74e8,#4650c4);
  box-shadow:0 6px 14px -8px rgba(79,91,214,.7);
}
.brand-mark svg{width:16px;height:16px}
.nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav a{color:var(--muted);font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap;transition:background-color .16s var(--ease),color .16s var(--ease)}
.nav a:hover{color:var(--ink);background:var(--surface-muted)}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:4px}
.top-actions .btn{color:var(--muted)}
.top-actions .btn:hover{color:var(--ink)}
.history-btn,.new-chat-btn{gap:6px}

/* ---------- 页面骨架 ---------- */
.app{
  height:calc(100dvh - 60px);
  max-width:1080px;margin:0 auto;padding:0 20px;
  display:grid;grid-template-columns:150px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);gap:18px;
}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.messages{
  flex:1;min-height:0;overflow-y:auto;
  padding:26px 4px 10px;
}

/* ---------- 左侧流水线 ---------- */
.pipeline-side{padding:26px 0 0;min-width:0;align-self:start}
.pipeline-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px 2px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.pipeline-list{list-style:none;margin:0;padding:0;position:relative}
.pipeline-node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:0 0 22px}
.pipeline-node::before{content:"";position:absolute;left:8px;top:9px;bottom:-10px;width:1px;background:var(--line)}
.pipeline-node:last-child{padding-bottom:0}
.pipeline-node:last-child::before{display:none}
.pipeline-dot{
  position:relative;z-index:1;width:17px;height:17px;flex:none;margin-top:1px;
  border:2px solid var(--line-strong);border-radius:50%;background:var(--surface);
}
.pipeline-dot.ok{background:var(--ok);border-color:var(--ok)}
.pipeline-dot.warn{background:var(--warn);border-color:var(--warn)}
.pipeline-dot.stop{background:var(--danger);border-color:var(--danger)}
.pipeline-text{min-width:0}
.pipeline-name{font-size:12.5px;font-weight:600;line-height:1.4;color:var(--ink-2);white-space:nowrap}
.pipeline-node.pending .pipeline-name{font-weight:500;color:var(--muted)}
.pipeline-meta{margin-top:1px;font-size:11px;line-height:1.5;color:var(--muted);overflow-wrap:break-word}
.pipeline-node.clickable{cursor:pointer}
.pipeline-node.clickable:hover .pipeline-name{color:var(--accent)}
.pipeline-override{
  margin-top:6px;padding:2px 8px;border:1px solid #f0dca4;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);font:inherit;font-size:11px;cursor:pointer;
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
.pipeline-override:hover{background:#f7e8c3;border-color:var(--warn)}
.pipeline-override:disabled{opacity:.55;cursor:not-allowed}

/* ---------- 空状态 ---------- */
.welcome{max-width:660px;margin:7vh auto 0;text-align:center;animation:fadeUp .32s var(--ease)}
.welcome-mark{
  width:52px;height:52px;margin:0 auto 18px;border-radius:16px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#6b74e8,#4650c4);
  box-shadow:0 14px 30px -16px rgba(79,91,214,.75);
}
.welcome-mark svg{width:26px;height:26px}
.welcome h1{margin:0 0 8px;font-size:24px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.welcome > p{margin:0 auto;max-width:470px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.prompt-label{margin:26px 0 0;font-size:11.5px;line-height:1.5;color:#9a9389;text-align:left}
.prompt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;text-align:left}
.prompt-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:0;
  padding:14px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);text-align:left;
}
.prompt-icon{
  width:30px;height:30px;margin-bottom:10px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--accent);background:var(--accent-soft);
}
.prompt-icon svg{width:16px;height:16px}
.prompt-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.prompt-title{font-size:13px;line-height:1.45;font-weight:600;color:var(--ink)}
.prompt-desc{font-size:12px;line-height:1.5;color:var(--muted)}
.welcome-note{margin:18px 0 0;font-size:11.5px;color:#9a9389}

/* ---------- 消息 ---------- */
.msg{display:flex;align-items:flex-start;gap:12px;margin:0 0 26px;animation:fadeUp .24s var(--ease)}
.msg.user{justify-content:flex-end}
.msg-avatar{
  width:28px;height:28px;margin-top:1px;flex:none;border-radius:9px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#6b74e8,#4650c4);
}
.msg-avatar svg{width:15px;height:15px}
.msg.error .msg-avatar{background:var(--danger-soft);color:var(--danger)}
.msg-body{flex:1;min-width:0}
.msg.user .msg-body{flex:0 1 auto;max-width:78%}
.msg-who{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;color:var(--muted)}
.thinking{display:flex;flex-direction:column;gap:6px;min-height:24px;font-size:12.5px;color:var(--muted)}
.thinking-head{display:flex;align-items:center;gap:8px}
.thinking-text{max-height:96px;overflow-y:auto;padding-left:9px;border-left:2px solid var(--line);font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-wrap;overflow-wrap:break-word}
.thinking.fade{opacity:0;transition:opacity .18s var(--ease)}
.stream-content{white-space:pre-wrap}
.thinking-dots{display:inline-flex;align-items:center;gap:3px}
.thinking-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.2s var(--ease) infinite}
.thinking-dots i:nth-child(2){animation-delay:.15s}
.thinking-dots i:nth-child(3){animation-delay:.3s}
.who-name{font-weight:600;color:var(--ink-2)}
.msg-content{max-width:820px;font-size:14.5px;line-height:1.78;overflow-wrap:break-word}
.msg-content p{margin:0 0 8px}
.msg-content p:last-child{margin-bottom:0}
.msg-content ul,.msg-content ol{margin:8px 0;padding-left:22px}
.msg-content ul,.bubble ul{list-style:disc}
.msg-content ol,.bubble ol{list-style:decimal}
.msg-content li{margin:3px 0}
.msg-content ul li::marker{color:var(--accent)}
.msg-content strong{font-weight:600;color:var(--ink)}
.msg-content h2,.msg-content h3,.msg-content h4{margin:14px 0 6px;line-height:1.45;font-weight:600}
.msg-content h2{font-size:17px}
.msg-content h3{font-size:15.5px}
.msg-content h4{font-size:14.5px}
.msg-content code,.bubble code,.error-card code{
  padding:1px 5px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface-muted);font-family:var(--mono);font-size:.9em;
}
.msg-content .md-table-wrap{margin:8px 0 10px;border:1px solid var(--line);border-radius:9px;overflow-x:auto;background:var(--surface)}
.msg-content .md-table-wrap table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.6}
.msg-content .md-table-wrap th,.msg-content .md-table-wrap td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.msg-content .md-table-wrap th{background:var(--surface-muted);font-weight:600;color:var(--ink);white-space:nowrap}
.msg-content .md-table-wrap tbody tr:last-child td{border-bottom:0}
.bubble{
  max-width:100%;padding:10px 14px;
  border:1px solid #e0e3fa;border-radius:16px;border-bottom-right-radius:6px;
  background:var(--accent-soft);color:#25264a;
  font-size:14.5px;line-height:1.7;overflow-wrap:break-word;
}
.bubble p{margin:0 0 6px}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
.bubble li{margin:2px 0}
.bubble strong{font-weight:600}
.error-card{
  max-width:820px;padding:10px 14px;
  border:1px solid #f0c9c4;border-radius:12px;
  background:var(--danger-soft);color:#7c2822;
  font-size:13.5px;line-height:1.7;
}

/* ---------- 工具事件 ---------- */
.events{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.event-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:2px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);font-size:11.5px;color:var(--muted);
}
.event-dot{width:6px;height:6px;flex:none;border-radius:50%;background:var(--line-strong)}
.event-dot.ok{background:var(--ok)}
.event-dot.bad{background:var(--danger)}
.event-run{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.event-link{
  font:inherit;color:var(--muted);cursor:pointer;text-align:left;
  transition:border-color .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease);
}
.event-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink-2)}
.event-status{
  width:12px;height:12px;flex:none;display:inline-block;position:relative;
  border-radius:50%;border:2px solid var(--line-strong);color:var(--line-strong);
}
.event-status::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.event-status.ok{border-color:var(--ok);color:var(--ok)}
.event-status.warn{border-color:var(--warn);color:var(--warn)}
.event-status.stop{border-color:var(--danger);color:var(--danger)}
.event-more{color:var(--muted);font-size:14px;line-height:1;margin-left:1px}
.event-override{
  display:inline-flex;align-items:center;
  padding:2px 9px;border:1px solid #f0dca4;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);
  font:inherit;font-size:11.5px;cursor:pointer;
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
.event-override:hover{background:#f7e8c3;border-color:var(--warn)}
.event-override:disabled{opacity:.55;cursor:not-allowed}

/* ---------- 实时工具调用 ---------- */
.tool-activity{display:flex;flex-direction:column;gap:6px;margin:10px 0 0;max-width:780px}
.tool-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);font-size:12px;color:var(--ink-2);
  animation:fadeUp .18s var(--ease);
}
.tool-row.error{border-color:#f0c9c4;background:var(--danger-soft);color:#7c2822}
.tool-spinner{
  width:12px;height:12px;flex:none;border-radius:50%;
  border:2px solid var(--accent-soft);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
.tool-mark{
  width:14px;height:14px;flex:none;display:grid;place-items:center;
  border-radius:50%;background:var(--ok);color:#fff;
  font-size:10px;font-weight:700;line-height:1;
}
.tool-row.error .tool-mark{background:var(--danger)}
.tool-name{font-weight:600;white-space:nowrap}
.tool-hint{min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-time{margin-left:auto;flex:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}

/* ---------- 执行过程 ---------- */
.trace{
  max-width:820px;margin-top:10px;overflow:hidden;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface);box-shadow:var(--shadow-sm);
}
.trace summary{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;list-style:none;user-select:none;
  font-size:12.5px;color:var(--ink-2);
  transition:background-color .16s var(--ease);
}
.trace summary::-webkit-details-marker{display:none}
.trace summary:hover{background:var(--surface-muted)}
.trace-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.trace.done .trace-dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.trace-title{font-weight:600}
.trace-meta{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{width:14px;height:14px;flex:none;color:var(--muted);transition:transform .18s var(--ease)}
.trace[open] .chev{transform:rotate(180deg)}
.trace-steps{position:relative;list-style:none;margin:0;padding:2px 14px 12px}
.trace-steps::before{content:"";position:absolute;left:23px;top:6px;bottom:16px;width:1px;background:var(--line)}
.step{position:relative;display:flex;align-items:flex-start;gap:10px;padding:4px 0;font-size:12.5px;color:var(--muted)}
.step .dot{
  position:relative;z-index:1;width:18px;height:18px;flex:none;
  display:grid;place-items:center;border-radius:50%;
  border:1.5px solid var(--line-strong);background:var(--surface);
}
.step .step-body{display:flex;flex-direction:column;gap:1px;min-width:0}
.step .name{line-height:18px;padding-top:0}
.step-detail{font-size:11.5px;line-height:1.55;color:var(--muted);font-weight:400;overflow-wrap:break-word}
.step.done{color:var(--ink-2)}
.step.done .dot{color:#fff;background:var(--ok);border-color:var(--ok)}
.step.done .dot svg{width:11px;height:11px}
.step.active{color:var(--accent-ink);font-weight:600}
.step.active .dot{
  border:2px solid var(--accent-soft);
  border-top-color:var(--accent);
  background:transparent;
  animation:spin .9s linear infinite;
}
.step.thought{cursor:pointer;font-weight:400}
.step.thought .dot{border-style:dashed;background:var(--surface)}
.step.thought .name{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:break-word}
.step.thought.open .name{color:var(--ink-2)}
.p-detail{padding:2px 14px 12px 52px;font-size:11.5px;line-height:1.55;color:var(--muted)}

/* ---------- 输入区 ---------- */
.composer-wrap{padding:6px 0 calc(14px + env(safe-area-inset-bottom))}
.composer{
  padding:8px 10px 10px;
  border:1px solid var(--line-strong);border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow-sm);
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-sm)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 8px}
.file-chip{
  display:inline-flex;align-items:center;gap:6px;max-width:220px;
  padding:3px 4px 3px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-muted);font-size:12px;color:var(--ink-2);
}
.file-chip svg{width:13px;height:13px;flex:none;color:var(--muted)}
.file-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip-x{
  padding:2px 4px;border:0;border-radius:5px;background:transparent;
  color:var(--muted);font-size:14px;line-height:1;cursor:pointer;
}
.file-chip-x:hover{background:var(--line);color:var(--ink)}
.composer-row{display:flex;align-items:flex-end;gap:6px}
.attach-btn{--size:2.25rem;flex:none;color:var(--muted)}
.attach-btn:hover{color:var(--ink)}
.composer textarea{
  flex:1;min-height:36px;max-height:140px;padding:7px 2px;
  border:0;outline:0;resize:none;background:transparent;
  font:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);
}
.composer textarea::placeholder{color:#a49c91}
.send-btn{--size:2.25rem;min-width:92px;flex:none;padding-inline:14px;border-radius:10px}
.send-btn .send-icon{width:15px;height:15px}
.send-btn .loading{display:none}
.send-btn.busy .send-icon{display:none}
.send-btn.busy .loading{display:inline-block}
.send-btn:disabled{background:#5b61b0;border-color:#5b61b0;color:#fff;opacity:1}
.bound{margin:6px 2px 0;font-size:11.5px;line-height:1.5;color:var(--muted)}
.tip{margin:8px 0 0;text-align:center;font-size:11.5px;color:var(--muted)}

/* ---------- 历史抽屉（原生 dialog） ---------- */
.history-dialog{
  position:fixed;inset:0;width:100%;height:100%;
  max-width:none;max-height:none;margin:0;padding:0;border:0;
  background:transparent;overflow:hidden;
}
.history-dialog::backdrop{background:rgba(30,28,25,.28);backdrop-filter:blur(2px)}
.history-panel{
  position:absolute;top:0;right:0;bottom:0;width:360px;max-width:88vw;
  display:flex;flex-direction:column;
  background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-16px 0 40px -24px rgba(30,28,25,.3);
  animation:slideIn .22s var(--ease);
}
.history-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);
  font-size:14px;font-weight:600;
}
.hist-list{flex:1;overflow-y:auto;padding:12px}
.hist-item{
  position:relative;display:flex;align-items:stretch;margin-bottom:8px;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface);overflow:hidden;
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
.hist-main{
  flex:1;min-width:0;padding:10px 12px;border:0;background:transparent;
  text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.hist-item:hover{border-color:var(--line-strong);background:var(--surface-muted)}
.hist-item.active{border-color:#cfd3f4;background:var(--accent-soft)}
.hist-item.active::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:0 2px 2px 0;background:var(--accent);z-index:1}
.hist-preview{font-size:13px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-meta{margin-top:4px;font-size:11.5px;color:var(--muted)}
.hist-del{
  width:36px;flex:none;border:0;border-left:1px solid var(--line);
  background:transparent;color:var(--muted);display:grid;place-items:center;
  cursor:pointer;opacity:.5;transition:background-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease);
}
.hist-del .icon{width:15px;height:15px}
.hist-item:hover .hist-del,.hist-item:focus-within .hist-del{opacity:1}
.hist-del:hover{background:var(--danger-soft);color:var(--danger)}
.hist-del:disabled{opacity:.35;cursor:not-allowed}
.hist-error{
  margin:0 0 8px;padding:8px 10px;border:1px solid #f0c9c4;border-radius:8px;
  background:var(--danger-soft);color:#7c2822;font-size:12px;line-height:1.5;
}
.hist-empty{padding:28px 16px;text-align:center;font-size:12.5px;color:var(--muted)}
@media (hover:none){.hist-del{opacity:1}}
body.drawer-open{overflow:hidden}

/* ---------- 删除确认弹窗 ---------- */
.confirm-dialog{
  width:calc(100% - 32px);max-width:420px;margin:auto;padding:0;border:0;
  background:transparent;overflow:visible;
}
.confirm-dialog::backdrop{background:rgba(30,28,25,.32);backdrop-filter:blur(2px)}
.confirm-card{
  margin:0;padding:20px;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow);
  animation:fadeUp .18s var(--ease);
}
.confirm-card h3{margin:0 0 8px;font-size:16px;line-height:1.4;font-weight:600;color:var(--ink)}
.confirm-card p{margin:0;font-size:13px;line-height:1.7;color:var(--muted);overflow-wrap:break-word}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ---------- S1 运行详情 ---------- */
.detail-dialog{
  width:calc(100% - 32px);max-width:720px;max-height:84vh;margin:auto;padding:0;border:0;
  background:transparent;overflow:visible;
}
.detail-dialog::backdrop{background:rgba(30,28,25,.34);backdrop-filter:blur(2px)}
.detail-card{
  display:flex;flex-direction:column;max-height:84vh;overflow:hidden;
  border:1px solid var(--line);border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow);animation:fadeUp .18s var(--ease);
}
.detail-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px 20px;border-bottom:1px solid var(--line);
}
.detail-kicker{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.detail-head h2{margin:2px 0 0;font-size:18px;line-height:1.35;font-weight:600}
.detail-body{padding:18px 20px 20px;overflow-y:auto}
.detail-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);
}
.detail-foot .detail-foot-hint{flex:1;min-width:200px;font-size:11.5px;line-height:1.55;color:var(--muted)}
.detail-state{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-muted);
}
.detail-state.ok{background:var(--ok-soft);border-color:#b6e3c8}
.detail-state.warn{background:var(--warn-soft);border-color:#f0dca4}
.detail-state.stop{background:var(--danger-soft);border-color:#f0c9c4}
.d-state-badge{
  display:inline-block;padding:1px 9px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:11.5px;line-height:19px;white-space:nowrap;
}
.d-state-badge.muted{background:var(--muted)}
.detail-state.ok .d-state-badge{background:var(--ok)}
.detail-state.warn .d-state-badge{background:var(--warn)}
.detail-state.stop .d-state-badge{background:var(--danger)}
.detail-state-msg{flex:1;min-width:200px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 0}
.detail-meta > div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-muted)}
.detail-meta .k{font-size:11px;color:var(--muted)}
.detail-meta .v{margin-top:2px;font-size:13px;line-height:1.55;color:var(--ink)}
.detail-section{margin-top:16px}
.detail-section h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink)}
.detail-list{list-style:none;margin:0;padding:0}
.detail-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.detail-list li:last-child{border-bottom:0}
.detail-sub{margin-top:3px;font-size:11.5px;line-height:1.6;color:var(--muted)}
.detail-note{margin:12px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.d-tag{
  display:inline-block;margin-right:6px;padding:0 7px;border-radius:999px;
  background:var(--surface-muted);color:var(--ink-2);font-size:10.5px;line-height:18px;
  white-space:nowrap;
}
.d-tag.ok{background:var(--ok-soft);color:var(--ok)}
.d-tag.warn{background:var(--warn-soft);color:var(--warn)}
.d-tag.stop{background:var(--danger-soft);color:var(--danger)}

.s3-approve{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-muted)}
.s3-approve-hint{flex:1;min-width:180px;font-size:11.5px;line-height:1.55;color:var(--muted)}
.s3-approve .btn{flex:none}
.s3-decide{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.s3-decide-btn{
  margin:0;padding:1px 9px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--surface);color:var(--ink-2);font:inherit;font-size:11px;cursor:pointer;
  transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease);
}
.s3-decide-btn:hover{border-color:var(--accent);color:var(--accent)}
.s3-decide-btn.accept.on{border-color:#bfe0c9;background:var(--ok-soft);color:var(--ok)}
.s3-decide-btn.reject.on{border-color:var(--line-strong);background:var(--surface-muted);color:var(--ink)}
.s3-decide-note{font-size:11px;line-height:1.5;color:var(--muted)}
.s3-error{color:var(--danger)}

.s2-detail-dialog,.s3-detail-dialog,.s4-detail-dialog,.s5-detail-dialog{max-width:1100px}
.s2-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.s4-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.s5-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.s5-draft{font-size:12.5px;line-height:1.8;color:var(--ink-2)}
.s5-draft h3{margin:14px 0 6px;font-size:15px;color:var(--ink)}
.s5-draft h4{margin:12px 0 5px;font-size:13.5px;color:var(--ink)}
.s5-draft p{margin:0 0 8px}
.s5-draft table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:11.5px}
.s5-draft th,.s5-draft td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.s5-draft th{background:var(--surface-muted);font-weight:600;color:var(--ink)}
.s5-token{padding:0 3px;border-radius:3px;background:var(--surface-muted);color:var(--accent);font-size:11px}
.s5-linetag{display:inline-block;margin-right:5px;padding:0 6px;border-radius:999px;font-size:10.5px;line-height:18px;font-weight:600;vertical-align:1px}
.s5-linetag.skeleton{background:var(--surface-muted);color:var(--accent);border:1px solid var(--line)}
.s5-linetag.supp{background:var(--warn-soft);color:var(--warn);border:1px solid #f0dca4}
.s5-legend{margin:8px 0;font-size:12px;line-height:2;color:var(--muted)}
.s5-disc{width:100%;border-collapse:collapse;margin:6px 0;font-size:11.5px}
.s5-disc th,.s5-disc td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.s5-disc th{background:var(--surface-muted);font-weight:600;color:var(--ink)}
.s5-disc tbody tr.disc-row{cursor:pointer}
.s5-disc tbody tr.disc-row:hover{background:var(--surface-muted)}
.disc-caret{display:inline-block;width:12px;color:var(--muted);transition:transform .12s}
tr.disc-row.open .disc-caret{transform:rotate(90deg)}
.s5-disc tr.disc-code-row td{padding:0 6px 10px;background:var(--surface-muted)}
.disc-code{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;white-space:pre;overflow:auto;max-height:420px;font-family:Consolas,"Courier New",monospace;font-size:11.5px;line-height:1.55;color:var(--ink)}
.disc-code-note{padding:8px 2px;font-size:11.5px;color:var(--muted)}
.s5-figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;margin:8px 0}
.s5-fig{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px}
.s5-fig img{display:block;width:auto;height:auto;max-width:100%;max-height:320px;margin:0 auto;border-radius:6px;background:#fff}
.s5-fig .cap{margin-top:8px;font-size:12px;line-height:1.6;color:var(--muted)}
.s5-engine{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:999px;background:#eef4ff;color:#2f5fa8;font-size:10.5px}
.s5-history{margin-top:14px}
.s5-history summary{cursor:pointer;font-weight:700;font-size:13.5px}
.s5-history-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.s5-history-item{text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;font-family:inherit;font-size:12px;color:var(--text);cursor:pointer}
.s5-history-item:hover{background:var(--surface-muted)}
.s5-history-draft{margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-muted);white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.65;max-height:320px;overflow:auto}

/* ---------- S5 内嵌编辑与审核 ---------- */
.s5-inline{margin:16px 0 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.s5-inline h4{margin:0 0 10px;font-size:13.5px;line-height:1.4;color:var(--ink)}
.s5-inline-note{margin:0 0 10px;font-size:11.5px;line-height:1.6;color:var(--muted)}
.s5-review-state{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-muted)}
.s5-review-badge{padding:1px 9px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;line-height:19px;white-space:nowrap}
.s5-review-badge.ok{background:var(--ok)}
.s5-review-badge.warn{background:var(--warn)}
.s5-review-badge.stop{background:var(--danger)}
.s5-review-msg{flex:1;min-width:180px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.s5-review-meta{margin:8px 0 0;font-size:11.5px;line-height:1.7;color:var(--muted)}
.s5-review-comments{margin:10px 0 0}
.s5-comment{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-muted);margin-bottom:7px}
.s5-comment .s5-comment-raw{font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.s5-comment .s5-comment-meta{margin-top:4px;font-size:11px;line-height:1.5;color:var(--muted)}
.s5-review-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.s5-review-row{margin-bottom:9px}
.s5-review-row label{display:block;margin-bottom:4px;font-size:11.5px;color:var(--muted)}
.s5-review-row input[type="text"],
.s5-review-row select,
.s5-comment textarea,
.s5-comment input[type="text"],
.s5-q-row textarea,
.s5-q-row input[type="text"],
.s5-q-row select{
  width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;line-height:1.55;
}
.s5-review-row input[type="text"]:focus,
.s5-comment textarea:focus,
.s5-q-row textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.s5-decision{display:flex;align-items:center;gap:18px;margin:8px 0;font-size:12.5px}
.s5-decision label{display:flex;align-items:center;gap:6px;cursor:pointer}
.s5-comment-grid{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr);gap:7px;margin-top:7px}
.s5-form-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.s5-inline-msg{margin:0;font-size:11.5px;line-height:1.5;color:var(--muted)}
.s5-inline-msg.error{color:var(--danger)}
.s5-q-rows{display:flex;flex-direction:column;gap:8px}
.s5-q-row{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-muted)}
.s5-q-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.s5-q-id{font-family:var(--mono);font-size:11px;color:var(--accent-ink)}
.s5-q-del{margin-left:auto;padding:1px 8px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font:inherit;font-size:10.5px;cursor:pointer}
.s5-q-del:hover{border-color:var(--danger);color:var(--danger)}
.s5-q-grid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px;margin-top:6px}
.s5-q-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.s5-review-materials{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.s5-review-materials summary{padding:8px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.s5-review-materials .s5-material-body{padding:0 10px 10px;font-size:12px;line-height:1.65;color:var(--muted)}
.s5-material-list{list-style:none;margin:0;padding:0}
.s5-material-list li{padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.s5-material-list li:last-child{border-bottom:0}
.s5-material-list b{color:var(--ink)}

/* ---------- S6 内嵌交付 ---------- */
.s6-inline{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-muted)}
.s6-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.s6-inline-msg{margin:0;font-size:11.5px;line-height:1.5;color:var(--muted)}
.s6-inline-msg.error{color:var(--danger)}
.s6-files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.s6-file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-muted);font-size:12px}
.s6-file a{min-width:0;color:var(--accent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s6-file .size{margin-left:auto;flex:none;color:var(--muted);font-family:var(--mono);font-size:10.5px}
.s6-download{
  flex:none;margin-left:2px;padding:2px 10px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--surface);color:var(--ink-2);font-size:10.5px;line-height:18px;white-space:nowrap;
  cursor:pointer;transition:color .16s var(--ease),border-color .16s var(--ease),background-color .16s var(--ease);
}
.s6-download:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.s6-manifest{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.s6-manifest summary{padding:8px 10px;font-size:12px;cursor:pointer}
.s6-manifest pre{margin:0;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:11px;line-height:1.55;max-height:320px;overflow:auto;white-space:pre-wrap}
.s6-empty{margin:10px 0 0;padding:14px;border:1px dashed var(--line-strong);border-radius:9px;color:var(--muted);font-size:12.5px;line-height:1.6;text-align:center}
.s6-empty .s6-actions{justify-content:center}
.s6-detail-dialog{max-width:900px}
@media (max-width:720px){
  .s5-comment-grid,.s5-q-grid{grid-template-columns:1fr}
}
.s5-fig .fig-missing{display:flex;align-items:center;justify-content:center;min-height:150px;border:1px dashed var(--line);border-radius:6px;background:var(--surface-muted);color:var(--muted);font-size:12.5px;text-align:center;padding:12px}
.s2-stat{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-muted)}.s2-stat .k{font-size:11px;color:var(--muted)}
.s2-stat .v{margin-top:2px;font-size:20px;font-weight:600;line-height:1.25;color:var(--ink)}
.s2-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.s2-table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}
.s2-table th{
  padding:8px 9px;text-align:left;font-weight:600;white-space:nowrap;
  color:var(--ink-2);background:var(--surface-muted);border-bottom:1px solid var(--line);
}
.s2-table td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2);line-height:1.55}
.s2-table tr:last-child td{border-bottom:0}
.s2-table .quote{min-width:220px;white-space:normal}
.s2-table .s2-source{min-width:110px;max-width:170px;overflow-wrap:anywhere}
.s2-table .s3-code{font-family:var(--mono);font-size:11px}
.s2-table .nowrap{white-space:nowrap}

@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes slideIn{from{opacity:.5;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .app{display:flex;flex-direction:column;gap:0;max-width:920px;padding:0 16px}
  .pipeline-side{padding:10px 0 0}
  .pipeline-head{display:none}
  .pipeline-list{display:flex;gap:8px;overflow-x:auto;padding:0 0 6px}
  .pipeline-node{flex:1 0 auto;padding:0;gap:6px;align-items:center}
  .pipeline-node::before{display:none}
  .pipeline-dot{width:14px;height:14px;margin:0}
  .pipeline-name{font-size:11.5px}
  .pipeline-meta{display:none}
  .pipeline-override{margin:0 0 0 2px;padding:1px 6px;font-size:10.5px}
  .chat-main{flex:1;min-height:0}
}

@media (max-width:720px){
  .topbar{height:58px;padding:0 12px;gap:10px}
  .brand{font-size:14px;gap:8px}
  .brand-mark{width:26px;height:26px;border-radius:8px}
  .nav a{padding:6px 7px;font-size:12px}
  .history-label,.new-chat-label{display:none}
  .app{height:calc(100dvh - 58px);padding:0 12px}
  .messages{padding:20px 2px 8px}
  .welcome{margin-top:5vh}
  .welcome h1{font-size:21px}
  .welcome > p{font-size:13px}
  .prompt-label{margin-top:20px}
  .prompt-grid{grid-template-columns:1fr;gap:8px;margin-top:8px}
  .prompt-card{flex-direction:row;align-items:center;gap:10px;padding:12px}
  .prompt-icon{margin:0}
  .msg{gap:10px;margin-bottom:22px}
  .msg-avatar{width:26px;height:26px;border-radius:8px}
  .msg.user .msg-body{max-width:88%}
  .msg-content{font-size:14px}
  .bubble{font-size:14px}
  .history-panel{width:88vw}
  .detail-dialog{max-height:90vh}
  .detail-card{max-height:90vh}
  .detail-head{padding:14px 16px}
  .detail-head h2{font-size:16px}
  .detail-body{padding:14px}
  .detail-foot{padding:12px 16px}
  .detail-meta{grid-template-columns:1fr}
  .s2-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .nav a{display:none}
}
@media (max-width:480px){
  .brand-name{display:none}
}
</style>
<link rel="stylesheet" href="/static/model-settings.css">
<script src="/static/model-settings.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/chat.html" aria-label="经营周报助手">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 17v-4.5M12 17V7M17 17v-7"/></svg>
    </span>
    <span class="brand-name">经营周报助手</span>
  </a>
  <nav class="nav" aria-label="主导航">
    <a href="/">准入检查</a>
    <a href="/s2.html">纪要拆卡</a>
    <a class="runs-link" href="/api/runs" target="_blank" rel="noreferrer">运行记录</a>
  </nav>
  <div class="top-actions">
    <button class="btn btn-ghost btn-sm new-chat-btn" id="newChatBtn" type="button" title="开始新对话" aria-label="开始新对话">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="new-chat-label">新对话</span>
    </button>
    <button class="btn btn-ghost btn-sm history-btn" id="historyBtn" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="history-label">历史</span>
    </button>
  </div>
</header>

<main class="app">
  <aside class="pipeline-side" aria-label="流水线进度">
    <div class="pipeline-head">流水线</div>
    <ol class="pipeline-list" id="pipelineList"></ol>
  </aside>

  <div class="chat-main">
  <section class="messages" id="messages" role="log" aria-live="polite" aria-label="对话"></section>

  <div class="composer-wrap">
    <section class="composer" aria-label="输入区">
      <div class="chips" id="chips" hidden></div>
      <div class="composer-row">
        <button class="btn btn-ghost btn-sm btn-square attach-btn" id="pickBtn" type="button" aria-label="选择文件" title="选择文件">

  var CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var TOOL_LABELS = {
    run_s1: "S1 准入", run_s2: "S2 拆卡", run_s3: "S3 对账",
    run_s4: "S4 修纪要", run_s5: "S5 扩写审核", fix_s5: "S5 定点修改", run_s6: "S6 交付",
    s5_questions: "S5 问题清单", recalc_card: "重算卡片",
    get_s5_draft: "读取 S5 正文",
    waive_conflicts: "登记人工豁免", get_review: "读取审核记录",
    get_delivery: "读取交付包", get_run: "读取运行记录",
    ask_data: "查询数据",
    check_approval: "检查审批", list_runs: "列出运行记录"
  };

  function toolHint(name, args) {
    args = args || {};
    if (name === "recalc_card") return [args.card_id, args.hint].filter(Boolean).join(" · ");
    if (name === "waive_conflicts") return (args.items || []).join("、");
    if (name === "s5_questions") return args.action ? "动作：" + args.action : "";
    if (name === "fix_s5") return (args.edits || []).length ? "改 " + args.edits.length + " 处" : "只重跑复核";
    if (name === "run_s5") return args.full ? "全量重跑" : "增量重算";
    if (name === "run_s1") return "检查本次上传的材料";
    if (name === "run_s2") return "把纪要拆成可核对卡片";
    if (name === "run_s3") return "取数并核对口径";
    if (name === "run_s4") return "按问题清单修纪要";
    if (name === "run_s6") return "按审核签名归档";
    if (name === "ask_data") {
      if (args.preview) return "原始数据前 " + args.preview + " 行";
      return args.question || "";
    }
    if (args.run_id) return args.run_id;
    return "";
  }
  var FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>';
  var TRASH = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg>';

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function setBound(text) {
    if (!bound) return;
    bound.textContent = text || "";
    bound.hidden = !text;
  }

  var pipeline = { s1: null, s2: null, s3: null, s4: null, s5: null, s6: null };
  var PIPELINE_STAGES = [
    { key: "s1", label: "S1 准入" },
    { key: "s2", label: "S2 拆卡" },
    { key: "s3", label: "S3 对账" },
    { key: "s4", label: "S4 修纪要" },
    { key: "s5", label: "S5 扩写审核" },
    { key: "s6", label: "S6 交付" }
  ];

  function emptyPipeline() {
    return { s1: null, s2: null, s3: null, s4: null, s5: null, s6: null };
  }

  function pipelineKey() {
    return sessionId ? "weekly_report_pipeline_" + sessionId : "";
  }

  function loadPipeline() {
    pipeline = emptyPipeline();
    var key = pipelineKey();
    if (!key) return;
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && typeof data === "object") {
        pipeline.s1 = data.s1 || null;
        pipeline.s2 = data.s2 || null;
        pipeline.s3 = data.s3 || null;
        pipeline.s4 = data.s4 || null;
        pipeline.s5 = data.s5 || null;
        pipeline.s6 = data.s6 || null;
      }
    } catch (e) {}
  }

  function savePipeline() {
    var key = pipelineKey();
    if (!key) return;
    try { localStorage.setItem(key, JSON.stringify(pipeline)); } catch (e) {}
  }

  function stageLabel(data, key) {
    if (!data) return "待运行";
    var state = String(data.state || "");
    if (key === "s5" && data.ok === false
        && (state === "可扩写" || state === "")) return "质检未通过";
    if (state === "ok" || state === "done") return "已完成";
    if (state === "blocked") return "对账未完成";
    return state || "已运行";
  }

  function syncPipelineFromServer(runId) {
    if (!runId) return Promise.resolve();
    return fetch("/api/pipeline/" + encodeURIComponent(runId))
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (!data || !data.ok || !data.stages) return;
        Object.keys(data.stages).forEach(function (key) {
          if (pipeline[key] === undefined) return;
          pipeline[key] = data.stages[key] || pipeline[key];
        });
        savePipeline();
        renderPipeline();
      })
      .catch(function () {});
  }

  function renderPipeline() {
    if (!pipelineList) return;
    pipelineList.textContent = "";
    PIPELINE_STAGES.forEach(function (stage) {
      var data = pipeline[stage.key];
      var tone = data ? stateTone(data.state) : "neutral";
      if (stage.key === "s5" && data && data.ok === false
          && String(data.state || "") === "可扩写") tone = "stop";
      var li = el("li", "pipeline-node" + (data ? "" : " pending"));
      li.appendChild(el("span", "pipeline-dot " + tone));
      var text = el("div", "pipeline-text");
      text.appendChild(el("div", "pipeline-name", stage.label));
      var meta = data ? (stageLabel(data, stage.key) + (data.run ? " · " + data.run : "")) : "待运行";
      text.appendChild(el("div", "pipeline-meta", meta));
      if (stage.key === "s1" && data && data.run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.addEventListener("click", function (event) {
          if (event.target.closest(".pipeline-override")) return;
          openRunDetail(data.run);
        });
        li.addEventListener("keydown", function (event) {
          if (event.target.closest(".pipeline-override")) return;
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openRunDetail(data.run);
          }
        });
        if (tone !== "ok") {
          var btn = el("button", "pipeline-override", "放权");
          btn.type = "button";
          btn.title = "人工放权并重跑 S1";
          btn.addEventListener("click", function (event) {
            event.stopPropagation();
            overrideRun(data.run, data.state || "", btn);
          });
          text.appendChild(btn);
        }
      }
      if (stage.key === "s2" && data && data.run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.setAttribute("aria-label", "查看 S2 拆卡详情");
        var openStage = function () { openS2Detail(data.run); };
        li.addEventListener("click", openStage);
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openStage();
          }
        });
      }
      if (stage.key === "s3" && data && data.run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.setAttribute("aria-label", "查看 S3 对账详情");
        var openS3 = function () { openS3Detail(data.run); };
        li.addEventListener("click", openS3);
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openS3();
          }
        });
      }
      var s4Run = (data && data.run) || (pipeline.s3 && pipeline.s3.run) || "";
      if (stage.key === "s4" && s4Run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.setAttribute("aria-label", "查看 S4 修纪要");
        var openS4 = function () {
          openS4Detail(s4Run);
        };
        li.addEventListener("click", openS4);
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openS4();
          }
        });
      }
      var s5Run = (data && data.run) || (pipeline.s4 && pipeline.s4.run)
        || (pipeline.s3 && pipeline.s3.run) || "";
      if (stage.key === "s5" && s5Run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.setAttribute("aria-label", "查看 S5 扩写");
        var openS5 = function () {
          openS5Detail(s5Run);
        };
        li.addEventListener("click", openS5);
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openS5();
          }
        });
      }
      var s6Run = (data && data.run) || (pipeline.s5 && pipeline.s5.run)
        || (pipeline.s4 && pipeline.s4.run) || "";
      if (stage.key === "s6" && s6Run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.setAttribute("aria-label", "查看 S6 交付");
        var openS6 = function () {
          openS6Detail(s6Run);
        };
        li.addEventListener("click", openS6);
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openS6();
          }
        });
      }
      li.appendChild(text);
      pipelineList.appendChild(li);
    });
  }

  function setPipelineStage(key, data) {
    pipeline[key] = data;
    savePipeline();
    renderPipeline();
  }

  function updatePipelineFromEvents(events) {
    if (!events || !events.length) return;
    var changed = false;
    events.forEach(function (ev) {
      var key = ev.tool === "run_s1" ? "s1"
        : (ev.tool === "run_s2" ? "s2"
        : (ev.tool === "run_s3" ? "s3"
        : (ev.tool === "run_s4" ? "s4"
        : (ev.tool === "run_s5" || ev.tool === "fix_s5" ? "s5"
        : (ev.tool === "run_s6" ? "s6" : "")))));
      if (!key) return;
      if (key === "s1") {
        pipeline.s2 = null;
        pipeline.s3 = null;
        pipeline.s4 = null;
        pipeline.s5 = null;
        pipeline.s6 = null;
      } else if (key === "s2") {
        pipeline.s3 = null;
        pipeline.s4 = null;
        pipeline.s5 = null;
        pipeline.s6 = null;
      } else if (key === "s3") {
        pipeline.s4 = null;
        pipeline.s5 = null;
        pipeline.s6 = null;
      } else if (key === "s4") {
        pipeline.s5 = null;
        pipeline.s6 = null;
      } else if (key === "s5") {
        pipeline.s6 = null;
      }
      pipeline[key] = { state: ev.state || "", run: ev.run_id || "", ok: !!ev.ok };
      changed = true;
    });
    if (changed) {
      savePipeline();
      renderPipeline();
    }
  }

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result || "");
        var comma = text.indexOf(",");
        resolve(comma >= 0 ? text.slice(comma + 1) : text);
      };
      reader.onerror = function () { reject(new Error("读取失败：" + file.name)); };
      reader.readAsDataURL(file);
    });
  }

  async function ensureSession() {
    if (sessionId) return;
    if (!picked.length) throw new Error("请先选择数据文件和纪要。");
    var payload = [];
    for (var i = 0; i < picked.length; i++) {
      payload.push({ name: picked[i].name, data: await readBase64(picked[i].file) });
    }
    var resp = await fetch("/api/chat/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: payload })
    });
    var data = await resp.json();
    if (!data.ok) throw new Error(data.error || "创建会话失败");
    sessionId = data.session_id;
    remember(sessionId);
    pipeline = emptyPipeline();
    loadPipeline();
    renderPipeline();
    boundNames = data.files || [];
    setBound("本次会话已绑定：" + boundNames.join("、"));
  }

  async function syncFiles() {
    if (!sessionId) return;
    var extra = picked.filter(function (item) { return boundNames.indexOf(item.name) < 0; });
    if (!extra.length) return;
    var payload = [];
    for (var i = 0; i < extra.length; i++) {
      payload.push({ name: extra[i].name, data: await readBase64(extra[i].file) });
    }
    var resp = await fetch("/api/chat/files", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, files: payload })
    });
    var data = await resp.json();
    if (!data.ok) throw new Error(data.error || "追加文件失败");
    boundNames = data.files || boundNames;
    setBound("本次会话已绑定：" + boundNames.join("、"));
  }

  function appendInline(parent, text) {
    var re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
    var last = 0;
    var match;
    while ((match = re.exec(text))) {
      if (match.index > last) parent.appendChild(document.createTextNode(text.slice(last, match.index)));
      var token = match[0];
      if (token.charAt(0) === "*") {
        var strong = el("strong");
        strong.textContent = token.slice(2, -2);
        parent.appendChild(strong);
      } else {
        var code = el("code");
        code.textContent = token.slice(1, -1);
        parent.appendChild(code);
      }
      last = match.index + token.length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function splitTableRow(line) {
    var trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return trimmed.split("|").map(function (cell) { return cell.trim(); });
  }

  function isTableSeparator(line) {
    return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(String(line || ""));
  }

  function buildTable(blockLines) {
    var head = splitTableRow(blockLines[0]);
    var wrap = el("div", "md-table-wrap");
    var table = el("table");
    var thead = el("thead");
    var headRow = el("tr");
    head.forEach(function (cell) {
      var th = el("th");
      appendInline(th, cell);
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    var body = blockLines.slice(2).filter(function (line) { return line.trim(); });
    if (body.length) {
      var tbody = el("tbody");
      body.forEach(function (line) {
        var cells = splitTableRow(line);
        var tr = el("tr");
        for (var c = 0; c < head.length; c++) {
          var td = el("td");
          appendInline(td, cells[c] || "");
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }
    wrap.appendChild(table);
    return wrap;
  }

  function renderRich(container, text) {
    var normalized = String(text || "").replace(/([。！？；])\s*-\s+/g, "$1\n- ");
    var lines = normalized.split(/\n/);
    var list = null;
    for (var index = 0; index < lines.length; index++) {
      var trimmed = lines[index].trim();
      if (!trimmed) { list = null; continue; }
      if (trimmed.indexOf("|") >= 0 && isTableSeparator(lines[index + 1])) {
        list = null;
        var end = index + 2;
        while (end < lines.length && lines[end].trim() && lines[end].indexOf("|") >= 0) end++;
        container.appendChild(buildTable(lines.slice(index, end)));
        index = end - 1;
        continue;
      }
      var heading = /^(#{1,3})\s+(.+)$/.exec(trimmed);
      if (heading) {
        list = null;
        var h = el("h" + Math.min(heading[1].length + 1, 4));
        appendInline(h, heading[2]);
        container.appendChild(h);
        continue;
      }
      var bullet = trimmed.indexOf("- ") === 0 || trimmed.indexOf("• ") === 0;
      var numbered = /^\d+[.、]\s+/.test(trimmed);
      if (bullet || numbered) {
        if (!list) {
          list = el(numbered ? "ol" : "ul");
          container.appendChild(list);
        }
        var item = el("li");
        appendInline(item, trimmed.replace(/^[-•]\s+/, "").replace(/^\d+[.、]\s+/, ""));
        list.appendChild(item);
      } else {
        list = null;
        var p = el("p");
        appendInline(p, trimmed);
        container.appendChild(p);
      }
    }
  }
  function appendMessage(role, text) {
    var stick = !messages.querySelector(".msg") || isNearBottom();
    removeWelcome();
    var msg = el("div", "msg " + role);
    if (role === "assistant") {
      var avatar = el("span", "msg-avatar");
      avatar.innerHTML = LOGO;
      msg.appendChild(avatar);
    } else if (role === "error") {
      var errAvatar = el("span", "msg-avatar");
      errAvatar.innerHTML = WARN;
      msg.appendChild(errAvatar);
    }
    var body = el("div", "msg-body");
    if (role !== "user") {
      var who = el("div", "msg-who");
      who.appendChild(el("span", "who-name", role === "error" ? "出错了" : "助手"));
      body.appendChild(who);
    }
    var content = el("div", role === "user" ? "bubble" : (role === "error" ? "error-card" : "msg-content"));
    renderRich(content, text);
    if (!content.childNodes.length) content.textContent = String(text || "");
    body.appendChild(content);
    msg.appendChild(body);
    messages.appendChild(msg);
    if (stick) scrollToBottom();
    return msg;
  }

  function stateTone(state) {
    var s = String(state || "").trim();
    if (s === "准入通过" || s === "可扩写" || s === "已生成" || s === "已通过"
        || s === "已核对" || s === "已交付" || s === "ok" || s === "done") return "ok";
    if (s === "待补充" || s === "扩写中" || s === "待审核" || s === "待裁决"
        || s === "未送审" || s === "warn" || s === "degrade") return "warn";
    if (s === "暂停" || s === "退回修改" || s === "对账未完成" || s === "blocked"
        || s === "质检未通过" || s === "failed" || s === "error") return "stop";
    return "neutral";
  }

    sec.appendChild(el("h3", "", title));
    return sec;
  }

  function renderRunDetail(intake) {
    var body = runDetailBody;
    body.textContent = "";

    var state = String(intake.state || "未知");
    var tone = stateTone(state);

    var bar = el("div", "detail-state " + tone);
    bar.appendChild(el("span", "d-state-badge", state));
    var manual = (intake.waived || []).some(function (item) {
      return (item.items || []).indexOf("人工放权") >= 0;
    });
    if (manual) bar.appendChild(el("span", "d-tag warn", "人工放权"));
    bar.appendChild(el("span", "detail-state-msg", intake.message || ""));
    body.appendChild(bar);

    var minutes = intake.minutes || {};
    var coverage = intake.coverage || {};
    var counts = intake.counts || {};
    var run = intake.run || {};

    var meta = el("div", "detail-meta");
    function addMeta(label, value) {
      var box = el("div");
      box.appendChild(el("div", "k", label));
      box.appendChild(el("div", "v", value || "—"));
      meta.appendChild(box);
    }
    var period = minutes.week || run.period_tag || "—";
    if (minutes.period_start) {
      period += " · " + minutes.period_start + " 至 " + (minutes.period_end || "—");
    }
    addMeta("周期", period);
    addMeta("材料", (counts.data || 0) + " 个数据文件 · " + (counts.minutes || 0) + " 份纪要");
    addMeta("指标", (minutes.metrics || []).join("、"));
    addMeta("实体", (minutes.entities || []).length + " 个 · 动作项 " + (minutes.actions || 0) + " 条");
    body.appendChild(meta);

    if (coverage.merged_start || coverage.merged_end) {
      body.appendChild(el("p", "detail-note",
        "数据覆盖：" + (coverage.merged_start || "?") + " 至 " + (coverage.merged_end || "?") +
        (coverage.covers_prompt_scope ? "，覆盖本次周期。" : "，未完全覆盖本次周期。")));
    }

    var files = intake.files || [];
    if (files.length) {
      var fileSec = detailSection("文件");
      var fileList = el("ul", "detail-list");
      files.forEach(function (file) {
        var li = el("li");
        li.appendChild(el("span", "d-tag", file.role || "文件"));
        li.appendChild(document.createTextNode(
          String(file.name || "") + " · " + (file.rows || 0) + " 行" +
          (file.columns && file.columns.length ? " · " + file.columns.length + " 列" : "")
        ));
        fileList.appendChild(li);
      });
      fileSec.appendChild(fileList);
      body.appendChild(fileSec);
    }

    var requirements = intake.requirements || [];
    if (requirements.length) {
      var reqSec = detailSection("需求矩阵");
      var reqList = el("ul", "detail-list");
      requirements.forEach(function (req) {
        var status = req.status === "have" ? "ok" : (req.status === "degrade" ? "warn" : "stop");
        var li = el("li");
        li.appendChild(el("span", "d-tag " + status,
          req.status === "have" ? "有" : (req.status === "degrade" ? "降级" : "缺")));
        li.appendChild(el("span", "d-tag", req.kind || "项"));
        li.appendChild(document.createTextNode(String(req.item || "")));
        if (req.evidence) li.appendChild(el("div", "detail-sub", req.evidence));
        if (req.impact) li.appendChild(el("div", "detail-sub", "影响：" + req.impact));
        reqList.appendChild(li);
      });
      reqSec.appendChild(reqList);
      body.appendChild(reqSec);
    }

    var problems = [];
    (intake.missing || []).forEach(function (item) {
      var text = "缺：" + (item.what || "");
      if (item.impact) text += "；影响：" + item.impact;
      if (item.how) text += "；处理：" + item.how;
      problems.push(text);
    });
    (intake.degrade || []).forEach(function (item) {
      problems.push("降级：" + (item.what || "") + (item.note ? "；" + item.note : ""));
    });
    var conflicts = (intake.consistency && intake.consistency.conflicts) || [];
    conflicts.forEach(function (item) {
      problems.push("冲突（" + (item.kind || "未知") + "）：" + (item.detail || ""));
    });
    (intake.questions || []).forEach(function (question) {
      if (problems.indexOf(question) < 0) problems.push(String(question));
    });

    if (problems.length) {
      var problemSec = detailSection("需要核对");
      var problemList = el("ul", "detail-list");
      problems.forEach(function (text) {
        problemList.appendChild(el("li", "", text));
      });
      problemSec.appendChild(problemList);
      body.appendChild(problemSec);
    } else if (state === "准入通过") {
      body.appendChild(el("p", "detail-note", "没有未解决的冲突或缺口。"));
    }

    var waived = intake.waived || [];
    if (waived.length) {
      var waiverSec = detailSection("人工豁免");
      waiverSec.appendChild(el("p", "detail-note",
        "以下事项由用户确认接受；后续阶段沿同一条裁决，不再当缺口或冲突。"));
      var waiverList = el("ul", "detail-list");
      waived.forEach(function (item) {
        var li = el("li");
        li.appendChild(el("span", "d-tag warn", "豁免"));
        li.appendChild(document.createTextNode((item.items || []).join("、") || "—"));
        if (item.reason) li.appendChild(el("div", "detail-sub", "理由：" + item.reason));
        if (item.by) li.appendChild(el("div", "detail-sub", "登记：" + item.by + " · " + (item.at || "—")));
        waiverList.appendChild(li);
      });
      waiverSec.appendChild(waiverList);
      body.appendChild(waiverSec);
    }

    if (intake.next_action) {
      var next = intake.next_action === "continue"
        ? "可以进入 S2 拆卡。"
        : "先处理上面的问题，再重跑 S1。";
      body.appendChild(el("p", "detail-note", "下一步：" + next));
    }

    var runTag = String(run.period_tag || "");
    if (state !== "准入通过" && runTag && (counts.data || 0) > 0 && (counts.minutes || 0) > 0) {
      runDetailFoot.appendChild(el("span", "detail-foot-hint",
        "放权会保留原始问题，相关结论无法用数据核实。"));
      var overrideBtn = el("button", "btn btn-error btn-sm", "人工放权");
      overrideBtn.type = "button";
      overrideBtn.addEventListener("click", function () {
        overrideRun(runTag, state, overrideBtn);
      });
      runDetailFoot.appendChild(overrideBtn);
      runDetailFoot.hidden = false;
    }
  }
