<!doctype html>
<html lang="zh-CN" data-theme="weekly">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>经营周报助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f5bd6'/%3E%3Cpath d='M10 22v-6M16 22V9M22 22v-4' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- 组件底座：DaisyUI 5（MIT），本地 vendor，离线可用 -->
<link rel="stylesheet" href="/static/vendor/daisyui.css">
<link rel="stylesheet" href="/static/theme.css">
<style>
/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:28px;
  height:60px;padding:0 24px;
  background:rgba(255,254,252,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.01em}
.brand:hover{color:var(--ink)}
.brand-name{white-space:nowrap}
.brand-mark{
  width:28px;height:28px;flex:none;border-radius:9px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#6b74e8,#4650c4);
  box-shadow:0 6px 14px -8px rgba(79,91,214,.7);
}
.brand-mark svg{width:16px;height:16px}
.nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav a{color:var(--muted);font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap;transition:background-color .16s var(--ease),color .16s var(--ease)}
.nav a:hover{color:var(--ink);background:var(--surface-muted)}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:4px}
.top-actions .btn{color:var(--muted)}
.top-actions .btn:hover{color:var(--ink)}
.history-btn,.new-chat-btn{gap:6px}

/* ---------- 页面骨架 ---------- */
.app{
  height:calc(100dvh - 60px);
  max-width:1080px;margin:0 auto;padding:0 20px;
  display:grid;grid-template-columns:150px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);gap:18px;
}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.messages{
  flex:1;min-height:0;overflow-y:auto;
  padding:26px 4px 10px;
}

/* ---------- 左侧流水线 ---------- */
.pipeline-side{padding:26px 0 0;min-width:0;align-self:start}
.pipeline-head{margin:0 0 14px 2px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.pipeline-list{list-style:none;margin:0;padding:0;position:relative}
.pipeline-list::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--line)}
.pipeline-node{position:relative;display:flex;gap:10px;align-items:flex-start;padding:0 0 22px}
.pipeline-node:last-child{padding-bottom:0}
.pipeline-dot{
  position:relative;z-index:1;width:17px;height:17px;flex:none;margin-top:1px;
  border:2px solid var(--line-strong);border-radius:50%;background:var(--surface);
}
.pipeline-dot.ok{background:var(--ok);border-color:var(--ok)}
.pipeline-dot.warn{background:var(--warn);border-color:var(--warn)}
.pipeline-dot.stop{background:var(--danger);border-color:var(--danger)}
.pipeline-text{min-width:0}
.pipeline-name{font-size:12.5px;font-weight:600;line-height:1.4;color:var(--ink-2);white-space:nowrap}
.pipeline-node.pending .pipeline-name{font-weight:500;color:var(--muted)}
.pipeline-meta{margin-top:1px;font-size:11px;line-height:1.5;color:var(--muted);overflow-wrap:break-word}
.pipeline-node.clickable{cursor:pointer}
.pipeline-node.clickable:hover .pipeline-name{color:var(--accent)}
.pipeline-override{
  margin-top:6px;padding:2px 8px;border:1px solid #f0dca4;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);font:inherit;font-size:11px;cursor:pointer;
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
.pipeline-override:hover{background:#f7e8c3;border-color:var(--warn)}
.pipeline-override:disabled{opacity:.55;cursor:not-allowed}

/* ---------- 空状态 ---------- */
.welcome{max-width:660px;margin:7vh auto 0;text-align:center;animation:fadeUp .32s var(--ease)}
.welcome-mark{
  width:52px;height:52px;margin:0 auto 18px;border-radius:16px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#6b74e8,#4650c4);
  box-shadow:0 14px 30px -16px rgba(79,91,214,.75);
}
.welcome-mark svg{width:26px;height:26px}
.welcome h1{margin:0 0 8px;font-size:24px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.welcome > p{margin:0 auto;max-width:470px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.prompt-label{margin:26px 0 0;font-size:11.5px;line-height:1.5;color:#9a9389;text-align:left}
.prompt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;text-align:left}
.prompt-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:0;
  padding:14px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);text-align:left;
}
.prompt-icon{
  width:30px;height:30px;margin-bottom:10px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--accent);background:var(--accent-soft);
}
.prompt-icon svg{width:16px;height:16px}
.prompt-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.prompt-title{font-size:13px;line-height:1.45;font-weight:600;color:var(--ink)}
.prompt-desc{font-size:12px;line-height:1.5;color:var(--muted)}
.welcome-note{margin:18px 0 0;font-size:11.5px;color:#9a9389}

/* ---------- 消息 ---------- */
.msg{display:flex;align-items:flex-start;gap:12px;margin:0 0 26px;animation:fadeUp .24s var(--ease)}
.msg.user{justify-content:flex-end}
.msg-avatar{
  width:28px;height:28px;margin-top:1px;flex:none;border-radius:9px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#6b74e8,#4650c4);
}
.msg-avatar svg{width:15px;height:15px}
.msg.error .msg-avatar{background:var(--danger-soft);color:var(--danger)}
.msg-body{flex:1;min-width:0}
.msg.user .msg-body{flex:0 1 auto;max-width:78%}
.msg-who{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;color:var(--muted)}
.thinking{display:flex;flex-direction:column;gap:6px;min-height:24px;font-size:12.5px;color:var(--muted)}
.thinking-head{display:flex;align-items:center;gap:8px}
.thinking-text{max-height:96px;overflow-y:auto;padding-left:9px;border-left:2px solid var(--line);font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-wrap;overflow-wrap:break-word}
.thinking.fade{opacity:0;transition:opacity .18s var(--ease)}
.stream-content{white-space:pre-wrap}
.thinking-dots{display:inline-flex;align-items:center;gap:3px}
.thinking-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.2s var(--ease) infinite}
.thinking-dots i:nth-child(2){animation-delay:.15s}
.thinking-dots i:nth-child(3){animation-delay:.3s}
.who-name{font-weight:600;color:var(--ink-2)}
.msg-content{max-width:820px;font-size:14.5px;line-height:1.78;overflow-wrap:break-word}
.msg-content p{margin:0 0 8px}
.msg-content p:last-child{margin-bottom:0}
.msg-content ul,.msg-content ol{margin:8px 0;padding-left:22px}
.msg-content ul,.bubble ul{list-style:disc}
.msg-content ol,.bubble ol{list-style:decimal}
.msg-content li{margin:3px 0}
.msg-content ul li::marker{color:var(--accent)}
.msg-content strong{font-weight:600;color:var(--ink)}
.msg-content h2,.msg-content h3,.msg-content h4{margin:14px 0 6px;line-height:1.45;font-weight:600}
.msg-content h2{font-size:17px}
.msg-content h3{font-size:15.5px}
.msg-content h4{font-size:14.5px}
.msg-content code,.bubble code,.error-card code{
  padding:1px 5px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface-muted);font-family:var(--mono);font-size:.9em;
}
.bubble{
  max-width:100%;padding:10px 14px;
  border:1px solid #e0e3fa;border-radius:16px;border-bottom-right-radius:6px;
  background:var(--accent-soft);color:#25264a;
  font-size:14.5px;line-height:1.7;overflow-wrap:break-word;
}
.bubble p{margin:0 0 6px}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
.bubble li{margin:2px 0}
.bubble strong{font-weight:600}
.error-card{
  max-width:820px;padding:10px 14px;
  border:1px solid #f0c9c4;border-radius:12px;
  background:var(--danger-soft);color:#7c2822;
  font-size:13.5px;line-height:1.7;
}

/* ---------- 工具事件 ---------- */
.events{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.event-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:2px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);font-size:11.5px;color:var(--muted);
}
.event-dot{width:6px;height:6px;flex:none;border-radius:50%;background:var(--line-strong)}
.event-dot.ok{background:var(--ok)}
.event-dot.bad{background:var(--danger)}
.event-run{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.event-link{
  font:inherit;color:var(--muted);cursor:pointer;text-align:left;
  transition:border-color .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease);
}
.event-link:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink-2)}
.event-status{
  width:12px;height:12px;flex:none;display:inline-block;position:relative;
  border-radius:50%;border:2px solid var(--line-strong);color:var(--line-strong);
}
.event-status::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.event-status.ok{border-color:var(--ok);color:var(--ok)}
.event-status.warn{border-color:var(--warn);color:var(--warn)}
.event-status.stop{border-color:var(--danger);color:var(--danger)}
.event-more{color:var(--muted);font-size:14px;line-height:1;margin-left:1px}
.event-override{
  display:inline-flex;align-items:center;
  padding:2px 9px;border:1px solid #f0dca4;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);
  font:inherit;font-size:11.5px;cursor:pointer;
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
.event-override:hover{background:#f7e8c3;border-color:var(--warn)}
.event-override:disabled{opacity:.55;cursor:not-allowed}

/* ---------- 执行过程 ---------- */
.trace{
  max-width:820px;margin-top:10px;overflow:hidden;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface);box-shadow:var(--shadow-sm);
}
.trace summary{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;list-style:none;user-select:none;
  font-size:12.5px;color:var(--ink-2);
  transition:background-color .16s var(--ease);
}
.trace summary::-webkit-details-marker{display:none}
.trace summary:hover{background:var(--surface-muted)}
.trace-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.trace.done .trace-dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.trace-title{font-weight:600}
.trace-meta{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{width:14px;height:14px;flex:none;color:var(--muted);transition:transform .18s var(--ease)}
.trace[open] .chev{transform:rotate(180deg)}
.trace-steps{position:relative;list-style:none;margin:0;padding:2px 14px 12px}
.trace-steps::before{content:"";position:absolute;left:23px;top:6px;bottom:16px;width:1px;background:var(--line)}
.step{position:relative;display:flex;align-items:flex-start;gap:10px;padding:4px 0;font-size:12.5px;color:var(--muted)}
.step .dot{
  position:relative;z-index:1;width:18px;height:18px;flex:none;
  display:grid;place-items:center;border-radius:50%;
  border:1.5px solid var(--line-strong);background:var(--surface);
}
.step .name{line-height:18px;padding-top:0}
.step.done{color:var(--ink-2)}
.step.done .dot{color:#fff;background:var(--ok);border-color:var(--ok)}
.step.done .dot svg{width:11px;height:11px}
.step.active{color:var(--accent-ink);font-weight:600}
.step.active .dot{
  border:0;
  background:conic-gradient(from 0deg,var(--accent) 0deg 100deg,var(--accent-soft) 100deg 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.4px));
  animation:spin .9s linear infinite;
}
.step.thought{cursor:pointer;font-weight:400}
.step.thought .dot{border-style:dashed;background:var(--surface)}
.step.thought .name{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:break-word}
.step.thought.open .name{color:var(--ink-2)}
.p-detail{padding:0 14px 12px 42px;font-size:12px;line-height:1.65;color:var(--muted)}

/* ---------- 输入区 ---------- */
.composer-wrap{padding:6px 0 calc(14px + env(safe-area-inset-bottom))}
.composer{
  padding:8px 10px 10px;
  border:1px solid var(--line-strong);border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow-sm);
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-sm)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 8px}
.file-chip{
  display:inline-flex;align-items:center;gap:6px;max-width:220px;
  padding:3px 4px 3px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-muted);font-size:12px;color:var(--ink-2);
}
.file-chip svg{width:13px;height:13px;flex:none;color:var(--muted)}
.file-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip-x{
  padding:2px 4px;border:0;border-radius:5px;background:transparent;
  color:var(--muted);font-size:14px;line-height:1;cursor:pointer;
}
.file-chip-x:hover{background:var(--line);color:var(--ink)}
.composer-row{display:flex;align-items:flex-end;gap:6px}
.attach-btn{--size:2.25rem;flex:none;color:var(--muted)}
.attach-btn:hover{color:var(--ink)}
.composer textarea{
  flex:1;min-height:36px;max-height:140px;padding:7px 2px;
  border:0;outline:0;resize:none;background:transparent;
  font:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);
}
.composer textarea::placeholder{color:#a49c91}
.send-btn{--size:2.25rem;min-width:92px;flex:none;padding-inline:14px;border-radius:10px}
.send-btn .send-icon{width:15px;height:15px}
.send-btn .loading{display:none}
.send-btn.busy .send-icon{display:none}
.send-btn.busy .loading{display:inline-block}
.send-btn:disabled{background:#5b61b0;border-color:#5b61b0;color:#fff;opacity:1}
.bound{margin:6px 2px 0;font-size:11.5px;line-height:1.5;color:var(--muted)}
.tip{margin:8px 0 0;text-align:center;font-size:11.5px;color:var(--muted)}

/* ---------- 历史抽屉（原生 dialog） ---------- */
.history-dialog{
  position:fixed;inset:0;width:100%;height:100%;
  max-width:none;max-height:none;margin:0;padding:0;border:0;
  background:transparent;overflow:hidden;
}
.history-dialog::backdrop{background:rgba(30,28,25,.28);backdrop-filter:blur(2px)}
.history-panel{
  position:absolute;top:0;right:0;bottom:0;width:360px;max-width:88vw;
  display:flex;flex-direction:column;
  background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-16px 0 40px -24px rgba(30,28,25,.3);
  animation:slideIn .22s var(--ease);
}
.history-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);
  font-size:14px;font-weight:600;
}
.hist-list{flex:1;overflow-y:auto;padding:12px}
.hist-item{
  position:relative;display:flex;align-items:stretch;margin-bottom:8px;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface);overflow:hidden;
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
.hist-main{
  flex:1;min-width:0;padding:10px 12px;border:0;background:transparent;
  text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.hist-item:hover{border-color:var(--line-strong);background:var(--surface-muted)}
.hist-item.active{border-color:#cfd3f4;background:var(--accent-soft)}
.hist-item.active::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:0 2px 2px 0;background:var(--accent);z-index:1}
.hist-preview{font-size:13px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-meta{margin-top:4px;font-size:11.5px;color:var(--muted)}
.hist-del{
  width:36px;flex:none;border:0;border-left:1px solid var(--line);
  background:transparent;color:var(--muted);display:grid;place-items:center;
  cursor:pointer;opacity:.5;transition:background-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease);
}
.hist-del .icon{width:15px;height:15px}
.hist-item:hover .hist-del,.hist-item:focus-within .hist-del{opacity:1}
.hist-del:hover{background:var(--danger-soft);color:var(--danger)}
.hist-del:disabled{opacity:.35;cursor:not-allowed}
.hist-error{
  margin:0 0 8px;padding:8px 10px;border:1px solid #f0c9c4;border-radius:8px;
  background:var(--danger-soft);color:#7c2822;font-size:12px;line-height:1.5;
}
.hist-empty{padding:28px 16px;text-align:center;font-size:12.5px;color:var(--muted)}
@media (hover:none){.hist-del{opacity:1}}
body.drawer-open{overflow:hidden}

/* ---------- 删除确认弹窗 ---------- */
.confirm-dialog{
  width:calc(100% - 32px);max-width:420px;margin:auto;padding:0;border:0;
  background:transparent;overflow:visible;
}
.confirm-dialog::backdrop{background:rgba(30,28,25,.32);backdrop-filter:blur(2px)}
.confirm-card{
  margin:0;padding:20px;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow);
  animation:fadeUp .18s var(--ease);
}
.confirm-card h3{margin:0 0 8px;font-size:16px;line-height:1.4;font-weight:600;color:var(--ink)}
.confirm-card p{margin:0;font-size:13px;line-height:1.7;color:var(--muted);overflow-wrap:break-word}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ---------- S1 运行详情 ---------- */
.detail-dialog{
  width:calc(100% - 32px);max-width:720px;max-height:84vh;margin:auto;padding:0;border:0;
  background:transparent;overflow:visible;
}
.detail-dialog::backdrop{background:rgba(30,28,25,.34);backdrop-filter:blur(2px)}
.detail-card{
  display:flex;flex-direction:column;max-height:84vh;overflow:hidden;
  border:1px solid var(--line);border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow);animation:fadeUp .18s var(--ease);
}
.detail-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px 20px;border-bottom:1px solid var(--line);
}
.detail-kicker{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.detail-head h2{margin:2px 0 0;font-size:18px;line-height:1.35;font-weight:600}
.detail-body{padding:18px 20px 20px;overflow-y:auto}
.detail-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);
}
.detail-foot .detail-foot-hint{flex:1;min-width:200px;font-size:11.5px;line-height:1.55;color:var(--muted)}
.detail-state{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-muted);
}
.detail-state.ok{background:var(--ok-soft);border-color:#b6e3c8}
.detail-state.warn{background:var(--warn-soft);border-color:#f0dca4}
.detail-state.stop{background:var(--danger-soft);border-color:#f0c9c4}
.d-state-badge{
  display:inline-block;padding:1px 9px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:11.5px;line-height:19px;white-space:nowrap;
}
.detail-state.ok .d-state-badge{background:var(--ok)}
.detail-state.warn .d-state-badge{background:var(--warn)}
.detail-state.stop .d-state-badge{background:var(--danger)}
.detail-state-msg{flex:1;min-width:200px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 0}
.detail-meta > div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-muted)}
.detail-meta .k{font-size:11px;color:var(--muted)}
.detail-meta .v{margin-top:2px;font-size:13px;line-height:1.55;color:var(--ink)}
.detail-section{margin-top:16px}
.detail-section h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink)}
.detail-list{list-style:none;margin:0;padding:0}
.detail-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.detail-list li:last-child{border-bottom:0}
.detail-sub{margin-top:3px;font-size:11.5px;line-height:1.6;color:var(--muted)}
.detail-note{margin:12px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.d-tag{
  display:inline-block;margin-right:6px;padding:0 7px;border-radius:999px;
  background:var(--surface-muted);color:var(--ink-2);font-size:10.5px;line-height:18px;
  white-space:nowrap;
}
.d-tag.ok{background:var(--ok-soft);color:var(--ok)}
.d-tag.warn{background:var(--warn-soft);color:var(--warn)}
.d-tag.stop{background:var(--danger-soft);color:var(--danger)}

.s2-detail-dialog,.s3-detail-dialog{max-width:1040px}
.s2-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.s2-stat{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-muted)}
.s2-stat .k{font-size:11px;color:var(--muted)}
.s2-stat .v{margin-top:2px;font-size:20px;font-weight:600;line-height:1.25;color:var(--ink)}
.s2-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.s2-table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}
.s2-table th{
  padding:8px 9px;text-align:left;font-weight:600;white-space:nowrap;
  color:var(--ink-2);background:var(--surface-muted);border-bottom:1px solid var(--line);
}
.s2-table td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2);line-height:1.55}
.s2-table tr:last-child td{border-bottom:0}
.s2-table .quote{min-width:220px;white-space:normal}
.s2-table .s2-source{min-width:110px;max-width:170px;overflow-wrap:anywhere}
.s2-table .s3-code{font-family:var(--mono);font-size:11px}
.s2-table .nowrap{white-space:nowrap}

@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes slideIn{from{opacity:.5;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:900px){

<script>
(function () {
  "use strict";

  var sessionId = null;
  var picked = [];
  var boundNames = [];

  var fileInput = document.getElementById("fileInput");
  var pickBtn = document.getElementById("pickBtn");
  var chips = document.getElementById("chips");
  var bound = document.getElementById("bound");
  var messages = document.getElementById("messages");
  var pipelineList = document.getElementById("pipelineList");
  var welcomeTpl = document.getElementById("welcomeTpl");
  var welcome = null;
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var sendLabel = document.getElementById("sendLabel");
  var newChatBtn = document.getElementById("newChatBtn");
  var historyBtn = document.getElementById("historyBtn");
  var historyDialog = document.getElementById("historyDialog");
  var historyList = document.getElementById("historyList");
  var drawerClose = document.getElementById("drawerClose");
  var confirmDialog = document.getElementById("confirmDialog");
  var confirmTitle = document.getElementById("confirmTitle");
  var confirmText = document.getElementById("confirmText");
  var confirmYes = document.getElementById("confirmYes");
  var confirmNo = document.getElementById("confirmNo");
  var confirmResolve = null;
  var runDetailDialog = document.getElementById("runDetailDialog");
  var runDetailTitle = document.getElementById("runDetailTitle");
  var runDetailBody = document.getElementById("runDetailBody");
  var runDetailFoot = document.getElementById("runDetailFoot");
  var runDetailClose = document.getElementById("runDetailClose");
  var s2DetailDialog = document.getElementById("s2DetailDialog");
  var s2DetailTitle = document.getElementById("s2DetailTitle");
  var s2DetailBody = document.getElementById("s2DetailBody");
  var s2DetailClose = document.getElementById("s2DetailClose");
  var s3DetailDialog = document.getElementById("s3DetailDialog");
  var s3DetailTitle = document.getElementById("s3DetailTitle");
  var s3DetailBody = document.getElementById("s3DetailBody");
  var s3DetailClose = document.getElementById("s3DetailClose");

  var LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 17v-4.5M12 17V7M17 17v-7"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg>';
  var WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 17.5A1.8 1.8 0 0 0 4 20.2h16a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/></svg>';
  var CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var TOOL_LABELS = { run_s1: "S1 准入", run_s2: "S2 拆卡", run_s3: "S3 对账" };
  var FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>';
  var TRASH = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg>';

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function setBound(text) {
    if (!bound) return;
    bound.textContent = text || "";
    bound.hidden = !text;
  }

  var pipeline = { s1: null, s2: null, s3: null };
  var PIPELINE_STAGES = [
    { key: "s1", label: "S1 准入" },
    { key: "s2", label: "S2 拆卡" },
    { key: "s3", label: "S3 对账" }
  ];

  function emptyPipeline() {
    return { s1: null, s2: null, s3: null };
  }

  function pipelineKey() {
    return sessionId ? "weekly_report_pipeline_" + sessionId : "";
  }

  function loadPipeline() {
    pipeline = emptyPipeline();
    var key = pipelineKey();
    if (!key) return;
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && typeof data === "object") {
        pipeline.s1 = data.s1 || null;
        pipeline.s2 = data.s2 || null;
        pipeline.s3 = data.s3 || null;
      }
    } catch (e) {}
  }

  function savePipeline() {
    var key = pipelineKey();
    if (!key) return;
    try { localStorage.setItem(key, JSON.stringify(pipeline)); } catch (e) {}
  }

  function stageLabel(data) {
    if (!data) return "待运行";
    var state = String(data.state || "");
    if (state === "ok" || state === "done") return "已完成";
    return state || "已运行";
  }

  function renderPipeline() {
    if (!pipelineList) return;
    pipelineList.textContent = "";
    PIPELINE_STAGES.forEach(function (stage) {
      var data = pipeline[stage.key];
      var tone = data ? stateTone(data.state) : "neutral";
      var li = el("li", "pipeline-node" + (data ? "" : " pending"));
      li.appendChild(el("span", "pipeline-dot " + tone));
      var text = el("div", "pipeline-text");
      text.appendChild(el("div", "pipeline-name", stage.label));
      var meta = data ? (stageLabel(data) + (data.run ? " · " + data.run : "")) : "待运行";
      text.appendChild(el("div", "pipeline-meta", meta));
      if (stage.key === "s1" && data && data.run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.addEventListener("click", function (event) {
          if (event.target.closest(".pipeline-override")) return;
          openRunDetail(data.run);
        });
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openRunDetail(data.run);
          }
        });
        if (tone !== "ok") {
          var btn = el("button", "pipeline-override", "放权");
          btn.type = "button";
          btn.title = "人工放权并重跑 S1";
          btn.addEventListener("click", function (event) {
            event.stopPropagation();
            overrideRun(data.run, data.state || "", btn);
          });
          text.appendChild(btn);
        }
      }
      if (stage.key === "s2" && data && data.run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.setAttribute("aria-label", "查看 S2 拆卡详情");
        var openStage = function () { openS2Detail(data.run); };
        li.addEventListener("click", openStage);
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openStage();
          }
        });
      }
      if (stage.key === "s3" && data && data.run) {
        li.classList.add("clickable");
        li.setAttribute("role", "button");
        li.setAttribute("tabindex", "0");
        li.setAttribute("aria-label", "查看 S3 对账详情");
        var openS3 = function () { openS3Detail(data.run); };
        li.addEventListener("click", openS3);
        li.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openS3();
          }
        });
      }
      li.appendChild(text);
      pipelineList.appendChild(li);
    });
  }

  function setPipelineStage(key, data) {
    pipeline[key] = data;
    savePipeline();
    renderPipeline();
  }

  function updatePipelineFromEvents(events) {
    if (!events || !events.length) return;
    var changed = false;
    events.forEach(function (ev) {

    });

      savePipeline();
      renderPipeline();
    }

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result || "");
        var comma = text.indexOf(",");
        resolve(comma >= 0 ? text.slice(comma + 1) : text);
      };
      reader.onerror = function () { reject(new Error("读取失败：" + file.name)); };
      reader.readAsDataURL(file);
    });
  }

  async function ensureSession() {
    if (sessionId) return;
    if (!picked.length) throw new Error("请先选择数据文件和纪要。");
    var payload = [];
    for (var i = 0; i < picked.length; i++) {
      payload.push({ name: picked[i].name, data: await readBase64(picked[i].file) });
    }
    var resp = await fetch("/api/chat/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: payload })
    });
    var data = await resp.json();
    if (!data.ok) throw new Error(data.error || "创建会话失败");
    sessionId = data.session_id;
    remember(sessionId);
    pipeline = emptyPipeline();
    loadPipeline();
    renderPipeline();
    boundNames = data.files || [];

  async function syncFiles() {
    if (!sessionId) return;
    var extra = picked.filter(function (item) { return boundNames.indexOf(item.name) < 0; });
    if (!extra.length) return;
    var payload = [];
    for (var i = 0; i < extra.length; i++) {

    }
    var resp = await fetch("/api/chat/files", {

    });

    boundNames = data.files || boundNames;

  function appendInline(parent, text) {
    var re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
    var last = 0;
    var match;
    while ((match = re.exec(text))) {
      if (match.index > last) parent.appendChild(document.createTextNode(text.slice(last, match.index)));
      var token = match[0];
      if (token.charAt(0) === "*") {
        var strong = el("strong");
        strong.textContent = token.slice(2, -2);
        parent.appendChild(strong);
      } else {
        var code = el("code");
        code.textContent = token.slice(1, -1);
        parent.appendChild(code);
      }
      last = match.index + token.length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function renderRich(container, text) {
    var normalized = String(text || "").replace(/([。！？；])\s*-\s+/g, "$1\n- ");
    var lines = normalized.split(/\n/);
    var list = null;
    lines.forEach(function (line) {
      var trimmed = line.trim();
      if (!trimmed) { list = null; return; }
      var heading = /^(#{1,3})\s+(.+)$/.exec(trimmed);
      if (heading) {
        list = null;
        var h = el("h" + Math.min(heading[1].length + 1, 4));
        appendInline(h, heading[2]);
        container.appendChild(h);
        return;
      }
      var bullet = trimmed.indexOf("- ") === 0 || trimmed.indexOf("• ") === 0;
      var numbered = /^\d+[.、]\s+/.test(trimmed);
      if (bullet || numbered) {
        if (!list) {
          list = el(numbered ? "ol" : "ul");
          container.appendChild(list);
        }
        var item = el("li");
        appendInline(item, trimmed.replace(/^[-•]\s+/, "").replace(/^\d+[.、]\s+/, ""));
        list.appendChild(item);
      } else {
        list = null;
        var p = el("p");
        appendInline(p, trimmed);
        container.appendChild(p);
      }
    });
  }
  function appendMessage(role, text) {
    var stick = !messages.querySelector(".msg") || isNearBottom();
    removeWelcome();
    var msg = el("div", "msg " + role);

      body.appendChild(who);
    }
    var content = el("div", role === "user" ? "bubble" : (role === "error" ? "error-card" : "msg-content"));
    renderRich(content, text);
    if (!content.childNodes.length) content.textContent = String(text || "");
    body.appendChild(content);
    msg.appendChild(body);
    messages.appendChild(msg);
    if (stick) scrollToBottom();
    return msg;

    var problems = [];

        var when = String(item.at || "").replace("T", " ").slice(5, 16);

        historyList.appendChild(li);

          ? matched.explain
          : (ledgerByCard[item.card] && ledgerByCard[item.card].spec ? ledgerByCard[item.card].spec : "");
        if (explain) li.appendChild(el("div", "detail-sub", explain));
        if (item.suggest) li.appendChild(el("div", "detail-sub", "建议：" + item.suggest));
        issueUl.appendChild(li);
      });
      issueSec.appendChild(issueUl);
      body.appendChild(issueSec);
    } else {
      body.appendChild(el("p", "detail-note", "没有对账问题。"));
    }

  }

  async function openS3Detail(runId) {
    if (!runId) return;
    s3DetailTitle.textContent = "S3 · " + String(runId).toUpperCase();
    s3DetailBody.textContent = "正在读取…";
    if (!s3DetailDialog.open) s3DetailDialog.showModal();
    try {
      var resp = await fetch("/api/s3/" + encodeURIComponent(runId));
      var data = await resp.json();
      if (!data.ok || !data.issues || !Object.keys(data.issues).length) {
        throw new Error(data.error || "没有这次对账结果");
      }
      renderS3Detail(data.issues, data.ledger || {});
    } catch (err) {
      s3DetailBody.textContent = "读取失败：" + (err.message || err);
    }
  }

  function updateS1Pill(tag, state) {
    var pills = messages.querySelectorAll(".event-link");
    Array.prototype.forEach.call(pills, function (pill) {
      if (pill.getAttribute("data-run") === String(tag)) {
        pill.setAttribute("data-state", state || "");
        var circle = pill.querySelector(".event-status");
        if (circle) circle.className = "event-status " + stateTone(state);
        var bar = pill.parentNode;
        if (bar) {
          var extras = bar.querySelectorAll(".event-override");
          Array.prototype.forEach.call(extras, function (extra) { extra.remove(); });
        }
      }
    });
  }

  async function overrideRun(tag, state, btn) {
    var ok = await askConfirm(
      "人工放权？",
      "S1 原始状态为「" + state + "」。放行后可以继续 S2，但原始问题会保留在记录里，相关结论无法用数据核实。",
      "确认放权"
    );
    if (!ok) return;
    btn.disabled = true;
    btn.textContent = "放权中…";
    try {
      var resp = await fetch("/api/runs/" + encodeURIComponent(tag) + "/waive", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          override: true,
          items: [],
          reason: "用户在 S1 详情中确认人工放权",
          session_id: sessionId || ""
        })
      });
      var data = await resp.json();
      if (!data.ok) throw new Error(data.error || "放权失败");
      setPipelineStage("s1", {
        state: (data.intake || {}).state || "准入通过",
        run: tag,
        ok: true
      });
      renderRunDetail(data.intake || {}, data.status || {});
      if (data.note) appendMessage("assistant", data.note);
    } catch (err) {
      var label = (btn.classList.contains("pipeline-override") || btn.classList.contains("event-override")) ? "放权" : "人工放权";
      btn.disabled = false;
      btn.textContent = label;
      var text = "放权失败：" + (err.message || err);
      if (runDetailDialog.open) {
        var note = el("p", "detail-note", text);
        runDetailBody.insertBefore(note, runDetailBody.firstChild);
        runDetailBody.scrollTop = 0;
      } else {
        appendMessage("error", text);
      }
    }
  }

  function appendEvents(events, msg) {
    if (!events || !events.length) return;
    var host = msg.querySelector(".msg-body") || msg;
    var bar = el("div", "events");
    events.forEach(function (ev) {
      var isS1 = ev.tool === "run_s1" && ev.run_id;
      var pill = el(isS1 ? "button" : "span", "event-pill" + (isS1 ? " event-link" : ""));
      if (isS1) {
        pill.type = "button";
        pill.title = "查看 S1 详情";
        pill.setAttribute("data-run", ev.run_id);
        pill.setAttribute("data-state", ev.state || "");
        pill.appendChild(el("span", "event-status " + stateTone(ev.state)));
      } else {
        var dot = el("span", "event-dot" + (ev.ok ? " ok" : (ev.state ? " bad" : "")));
        pill.appendChild(dot);
      }
      pill.appendChild(document.createTextNode(TOOL_LABELS[ev.tool] || ev.tool || "tool"));
      if (ev.run_id) pill.appendChild(el("span", "event-run", ev.run_id));
      if (isS1) {
        pill.appendChild(el("span", "event-more", "›"));
        pill.addEventListener("click", function () { openRunDetail(ev.run_id); });
      } else {
        pill.title = [ev.tool, ev.run_id, ev.state].filter(Boolean).join(" · ");
      }
      bar.appendChild(pill);
      if (isS1 && stateTone(ev.state) !== "ok") {
        var overrideBtn = el("button", "event-override", "放权");
        overrideBtn.type = "button";
        overrideBtn.title = "人工放权并重跑 S1";
        overrideBtn.addEventListener("click", function () {
          overrideRun(ev.run_id, ev.state, overrideBtn);
        });
        bar.appendChild(overrideBtn);
      }
    });
    host.appendChild(bar);
  }

  function appendProgress() {
    var stick = !messages.querySelector(".msg") || isNearBottom();
    removeWelcome();
    var msg = el("div", "msg assistant");
    var avatar = el("span", "msg-avatar");
    avatar.innerHTML = LOGO;
    msg.appendChild(avatar);
    var body = el("div", "msg-body");
    var who = el("div", "msg-who");
    who.appendChild(el("span", "who-name", "助手"));
    body.appendChild(who);
    var thinking = el("div", "thinking");
    var thinkingHead = el("div", "thinking-head");
    var dots = el("span", "thinking-dots");
    dots.appendChild(el("i"));
    dots.appendChild(el("i"));
    dots.appendChild(el("i"));
    thinkingHead.appendChild(dots);
    thinkingHead.appendChild(el("span", "", "正在思考…"));
    thinking.appendChild(thinkingHead);
    var thinkingText = el("div", "thinking-text");
    thinkingText.hidden = true;
    thinking.appendChild(thinkingText);
    body.appendChild(thinking);
    var streamContent = el("div", "msg-content stream-content");
    streamContent.hidden = true;
    body.appendChild(streamContent);
    var trace = el("details", "trace");
    trace.hidden = true;
    trace.open = true;
    var head = el("summary", "trace-head");
    head.appendChild(el("span", "trace-dot"));
    var title = el("span", "trace-title", "执行过程");
    head.appendChild(title);
    var meta = el("span", "trace-meta", "准备中…");
    head.appendChild(meta);
    head.insertAdjacentHTML("beforeend", CHEVRON);
    var list = el("ol", "trace-steps");
    var detail = el("div", "p-detail", "");
    trace.appendChild(head);
    trace.appendChild(list);
    trace.appendChild(detail);
    body.appendChild(trace);
    msg.appendChild(body);
    messages.appendChild(msg);
    if (stick) scrollToBottom();
    return {
      wrap: msg, trace: trace, title: title, meta: meta, list: list, detail: detail,
      thinking: thinking, thinkingText: thinkingText, streamContent: streamContent,
      finished: false
    };
  }

  function renderProgress(target, data) {
    var states = data.states || [];
    var total = (data.steps || []).length || 8;
    target.title.textContent = "执行过程";
    if (data.started) {
      target.trace.hidden = false;
      // 没有思考原文时，用步骤本身表示进行中，避免重复一行「正在思考」
      if (!target.thinkingText.textContent) target.thinking.hidden = true;
    }
    target.list.textContent = "";
    (data.steps || []).forEach(function (name, index) {
      var state = states[index] || "pending";
      if (state === "pending") return;
      var item = el("li", "step " + state);
      var dot = el("span", "dot");
      if (state === "done") dot.innerHTML = CHECK;
      item.appendChild(dot);
      item.appendChild(el("span", "name", name));
      target.list.appendChild(item);
    });
    if (data.finished) {
      target.meta.textContent = "已完成";
      target.trace.classList.add("done");
      target.detail.hidden = true;
      if (!target.finished) {
        target.finished = true;
        target.trace.open = false;
      }
    } else if (data.started) {
      target.meta.textContent = "进行中 · " + Math.min((data.current || 0) + 1, total) + "/" + total;
      target.detail.hidden = false;
      target.detail.textContent = data.detail || "进行中…";
    } else {
      target.meta.textContent = "准备中…";
      target.detail.hidden = true;
    }
    if (isNearBottom()) scrollToBottom();
  }

  function pollProgress(target) {
    if (!sessionId) return Promise.resolve();
    return fetch("/api/chat/progress?session_id=" + encodeURIComponent(sessionId))
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (!data.ok) return;
        if (!data.started && !(data.thoughts || []).length) return;
        target.last = data;
        renderProgress(target, data);
      })
      .catch(function () {});
  }

  // ---- 会话持久化 ----
  var SESSION_KEY = "weekly_report_session";

  function remember(id) {
    try { localStorage.setItem(SESSION_KEY, id || ""); } catch (e) {}
  }
  function recall() {
    try { return localStorage.getItem(SESSION_KEY) || ""; } catch (e) { return ""; }
  }

  async function restoreSession(id) {
    var resp = await fetch("/api/chat/history/" + encodeURIComponent(id));
    var data = await resp.json();
    if (!data.ok) {
      remember("");
      throw new Error(data.error || "恢复失败");
    }
    sessionId = data.session_id;
    loadPipeline();
    renderPipeline();
    boundNames = data.files || [];
    setBound(boundNames.length
      ? "本次会话已绑定：" + boundNames.join("、")
      : "这个对话没有附件，可重新选择文件");
    picked = [];
    renderChips();
    renderWelcome();
    (data.messages || []).forEach(function (m) {
      appendMessage(m.role === "user" ? "user" : "assistant", m.text);
    });
    remember(sessionId);
    scrollToBottom();
  }

  function closeHistory() {
    if (historyDialog.open) historyDialog.close();
  }

  function askConfirm(title, text, label) {
    return new Promise(function (resolve) {
      confirmResolve = resolve;
      confirmTitle.textContent = title;
      confirmText.textContent = text;
      confirmYes.textContent = label || "确定";
      confirmDialog.returnValue = "";
      if (!confirmDialog.open) confirmDialog.showModal();
      confirmNo.focus();
    });
  }

  function showHistoryError(text) {
    var old = historyList.querySelector(".hist-error");
    if (old) old.remove();
    historyList.insertBefore(el("p", "hist-error", text), historyList.firstChild);
  }

  function startNewChat() {
    if (sendBtn.disabled) return;
    sessionId = null;
    pipeline = emptyPipeline();
    renderPipeline();
    boundNames = [];
    picked = [];
    renderChips();
    setBound("");
    remember("");
    input.value = "";
    resizeInput();
    renderWelcome();
    closeHistory();
    input.focus();
  }

  function openHistory() {
    if (!historyDialog.open) historyDialog.showModal();
    document.body.classList.add("drawer-open");
    historyList.textContent = "";
    drawerClose.focus();
    fetch("/api/chat/history")
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        var sessions = data.sessions || [];
        if (!sessions.length) {
          historyList.appendChild(el("p", "hist-empty", "还没有保存过的对话。"));
          return;
        }
        sessions.forEach(function (item) {
          var row = el("div", "hist-item" + (item.session_id === sessionId ? " active" : ""));
          var main = el("button", "hist-main");
          main.type = "button";
          main.appendChild(el("div", "hist-preview", item.preview || "（无文字）"));
          var meta = [
            item.updated_at ? item.updated_at.replace("T", " ").slice(5, 16) : "",
            (item.files || []).length + " 个文件",
            item.turns + " 轮"
          ].filter(Boolean).join(" · ");
          main.appendChild(el("div", "hist-meta", meta));
          main.addEventListener("click", async function () {
            if (item.session_id === sessionId) { closeHistory(); return; }
            try {
              clearMessages();
              sessionId = null;
              await restoreSession(item.session_id);
              closeHistory();
            } catch (err) {
              closeHistory();
              appendMessage("error", "切换失败：" + (err.message || err));
            }
          });
          row.appendChild(main);

          var del = el("button", "hist-del");
          del.type = "button";
          del.title = "删除这个对话";
          del.setAttribute("aria-label", "删除这个对话");
          del.innerHTML = TRASH;
          del.disabled = sendBtn.disabled;
          del.addEventListener("click", async function (event) {
            event.stopPropagation();
            if (sendBtn.disabled) return;
            var preview = String(item.preview || "（无文字）");
            if (preview.length > 40) preview = preview.slice(0, 40) + "…";
            var ok = await askConfirm(
              "删除这个对话？",
              "「" + preview + "」删除后不可恢复，消息和附件都会一起删除。",
              "删除"
            );
            if (!ok) return;
            del.disabled = true;
            try {
              var resp = await fetch("/api/chat/delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: item.session_id })
              });
              var data = await resp.json();
              if (!data.ok) throw new Error(data.error || "删除失败");
              if (item.session_id === sessionId) {
                startNewChat();
              } else {
                row.remove();
                if (!historyList.querySelector(".hist-item")) {
                  historyList.appendChild(el("p", "hist-empty", "还没有保存过的对话。"));
                }
              }
            } catch (err) {
              del.disabled = false;
              showHistoryError("删除失败：" + (err.message || err));
            }
          });
          row.appendChild(del);
          historyList.appendChild(row);
        });
      })
      .catch(function (err) {
        historyList.appendChild(el("p", "hist-empty", "读取失败：" + err.message));
      });
  }

  function clearMessages() {
    renderWelcome();
  }

  if (newChatBtn) newChatBtn.addEventListener("click", startNewChat);
  historyBtn.addEventListener("click", openHistory);
  drawerClose.addEventListener("click", closeHistory);
  historyDialog.addEventListener("click", function (event) {
    if (event.target === historyDialog) closeHistory();
  });
  historyDialog.addEventListener("close", function () {
    document.body.classList.remove("drawer-open");
  });

  confirmNo.addEventListener("click", function () { confirmDialog.close("cancel"); });
  confirmYes.addEventListener("click", function () { confirmDialog.close("confirm"); });
  confirmDialog.addEventListener("click", function (event) {
    if (event.target === confirmDialog) confirmDialog.close("cancel");
  });
  confirmDialog.addEventListener("close", function () {
    var ok = confirmDialog.returnValue === "confirm";
    confirmDialog.returnValue = "";
    if (confirmResolve) {
      var done = confirmResolve;
      confirmResolve = null;
      done(ok);
    }
  });

  runDetailClose.addEventListener("click", function () { runDetailDialog.close(); });
  runDetailDialog.addEventListener("click", function (event) {
    if (event.target === runDetailDialog) runDetailDialog.close();
  });

  s2DetailClose.addEventListener("click", function () { s2DetailDialog.close(); });
  s2DetailDialog.addEventListener("click", function (event) {
    if (event.target === s2DetailDialog) s2DetailDialog.close();
  });

  s3DetailClose.addEventListener("click", function () { s3DetailDialog.close(); });
  s3DetailDialog.addEventListener("click", function (event) {
    if (event.target === s3DetailDialog) s3DetailDialog.close();
  });

  function setBusy(busy) {
    sendBtn.disabled = busy;
    sendBtn.classList.toggle("busy", busy);
    sendBtn.setAttribute("aria-busy", busy ? "true" : "false");
    if (sendLabel) sendLabel.textContent = busy ? "思考中" : "发送";
    if (newChatBtn) newChatBtn.disabled = busy;
  }

  function consumeStream(resp, pending) {
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = "";
    var finalData = null;
    var failure = null;

    function handle(event) {
      if (!event || typeof event !== "object") return;
      if (event.type === "reasoning") {
        var reasoning = event.delta || "";
        if (!reasoning) return;
        pending.thinking.hidden = false;
        if (pending.thinkingText.hidden) pending.thinkingText.hidden = false;
        pending.thinkingText.textContent += reasoning;
        pending.thinkingText.scrollTop = pending.thinkingText.scrollHeight;
        if (isNearBottom()) scrollToBottom();
      } else if (event.type === "content") {
        var content = event.delta || "";
        if (!content) return;
        pending.streamContent.hidden = false;
        pending.streamContent.textContent += content;
        if (sendLabel && sendLabel.textContent === "思考中") sendLabel.textContent = "输出中";
        if (isNearBottom()) scrollToBottom();
      } else if (event.type === "content_reset") {
        pending.streamContent.textContent = "";
        pending.streamContent.hidden = true;
        if (sendLabel) sendLabel.textContent = "思考中";
      } else if (event.type === "done") {
        finalData = event;
      } else if (event.type === "error") {
        failure = new Error(event.error || "助手调用失败");
      }
    }

    function parseLine(line) {
      if (line.charAt(line.length - 1) === "\r") line = line.slice(0, -1);
      if (line.indexOf("data:") !== 0) return;
      var raw = line.slice(5).trim();
      if (!raw) return;
      var event;
      try { event = JSON.parse(raw); } catch (e) { return; }
      handle(event);
    }

    return (async function () {
      while (true) {
        var step = await reader.read();
        if (step.done) break;
        buffer += decoder.decode(step.value, { stream: true });
        var index;
        while ((index = buffer.indexOf("\n")) >= 0) {
          parseLine(buffer.slice(0, index));
          buffer = buffer.slice(index + 1);
        }
        if (failure) {
          try { await reader.cancel(); } catch (e) {}
          throw failure;
        }
      }
      if (buffer.trim()) parseLine(buffer);
      if (failure) throw failure;
      if (!finalData) throw new Error("连接中断，没有收到完成信号");
      return finalData;
    })();
  }

  async function send() {
    if (sendBtn.disabled) return;
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    appendMessage("user", text);
    setBusy(true);
    var pending = appendProgress();
    var timer = null;
    try {
      await ensureSession();
      await syncFiles();
      timer = setInterval(function () { pollProgress(pending); }, 350);
      var resp = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "text/event-stream"
        },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      var type = resp.headers.get("content-type") || "";
      if (!resp.ok || type.indexOf("text/event-stream") < 0) {
        var errorData = null;
        try { errorData = await resp.json(); } catch (e) {}
        throw new Error((errorData && errorData.error) || "助手调用失败");
      }
      var finalData = await consumeStream(resp, pending);
      if (timer) clearInterval(timer);
      await pollProgress(pending);

      var usedS1 = (finalData.events || []).some(function (e) { return e.tool === "run_s1"; });
      var reply = finalData.reply || pending.streamContent.textContent || "（没有返回内容）";
      pending.streamContent.textContent = "";
      pending.streamContent.classList.remove("stream-content");
      renderRich(pending.streamContent, reply);
      if (!pending.streamContent.childNodes.length) pending.streamContent.textContent = reply;
      pending.streamContent.hidden = false;

      // 输出完成：思考过程淡出并移除
      pending.thinking.classList.add("fade");
      setTimeout(function () {
        if (pending.thinking.parentNode) pending.thinking.remove();
      }, 200);

      if (usedS1 && pending.list.querySelector(".step")) {
        pending.trace.hidden = false;
        pending.meta.textContent = "已完成";
        pending.trace.classList.add("done");
        pending.trace.open = false;
        pending.detail.hidden = true;
      } else {
        pending.trace.remove();
      }
      updatePipelineFromEvents(finalData.events);
      if (isNearBottom()) scrollToBottom();
    } catch (err) {
      if (timer) clearInterval(timer);
      pending.wrap.remove();
      appendMessage("error", err.message || String(err));
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      if (event.isComposing) return;
      event.preventDefault();
      send();
    }
  });
  input.addEventListener("input", resizeInput);

  renderWelcome();
  renderPipeline();
  resizeInput();

  var savedId = recall();
  if (savedId) {
    restoreSession(savedId).catch(function () {
      remember("");
      setBound("上次的对话没找到，重新选文件即可开始。");
    });
  }
})();
</script>
